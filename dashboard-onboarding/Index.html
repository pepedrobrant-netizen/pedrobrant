<!doctype html>
<html lang="pt-BR">
<head>
<!-- Dashboard Onboarding — frontend inteiro num arquivo só (HTML + CSS + JS inline),
     sem build step, como exige rodar dentro do Google Apps Script (HtmlService).

     Este arquivo segue de perto o mockup de UI/UX aprovado (mesma folha de estilo,
     mesma estrutura de telas e componentes) — a diferença é só na fiação de dados:
     aqui os dados vêm de verdade do Código.gs (scriptlets do tipo "unescaped-print"
     do Apps Script), o login é
     validado no servidor (google.script.run.login), e toda escrita (CRM, fotos,
     missões) é persistida via google.script.run em vez de ficar só em memória. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Onboarding</title>
<style>
  :root {
    color-scheme: light;
    --surface-page:   #f5f3ef;
    --surface-card:   #ffffff;
    --surface-header: #0d0d0d;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --brand-orange:   #ff4000;
    --brand-yellow:   #ffd450;
    --brand-gray:     #c3bfb8;
    --brand-maroon:   #3e0f1d;
    --brand-lemon:    #6dff96;
    --brand-purple:   #b48eff;
    --brand-blue:     #44d0ff;
    --status-good:      #0ca30c;
    --status-warning:   #fab219;
    --status-serious:   #ec835a;
    --status-critical:  #d03b3b;
    --status-progress:  #2a78d6;
    --success-text:    #006300;
    --font-body: 'Hotmart Sans', 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Hotmart Display', Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-page:   #0d0d0d;
    --surface-card:   #1a1a19;
    --surface-header: #000000;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.12);
    --brand-orange:   #ff5a24;
    --brand-yellow:   #ffd450;
    --brand-gray:     #c3bfb8;
    --brand-maroon:   #5a2032;
    --brand-lemon:    #6dff96;
    --brand-purple:   #b48eff;
    --brand-blue:     #44d0ff;
    --status-good:      #0ca30c;
    --status-warning:   #fab219;
    --status-serious:   #ec835a;
    --status-critical:  #e66767;
    --status-progress:  #3987e5;
    --success-text:    #0ca30c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--surface-page); color: var(--text-primary); font-family: var(--font-body); }
  h1, h2, h3, .auth-title, .auth-right-copy h3, .profiles-title, .auth-tagline { font-family: var(--font-display); }

  .topbar { background: var(--surface-header); color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .topbar .brand { display: flex; align-items: center; gap: 10px; }
  .flame { width: 22px; height: 22px; display: inline-block; color: var(--brand-orange); flex-shrink: 0; }
  .flame path { fill: currentColor; }
  .topbar h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .topbar .sub { font-size: 12px; color: #c3c2b7; margin-top: 1px; }
  .theme-toggle { background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .topbar-profile-wrap { position: relative; }
  .topbar-profile-btn { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 20px; padding: 4px 10px 4px 4px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .topbar-profile-btn:hover { background: rgba(255,255,255,0.08); }
  .topbar-profile-btn .chev { font-size: 9px; color: #c3c2b7; }
  .topbar-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--brand-orange); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; flex-shrink: 0; overflow: hidden; }
  .topbar-avatar-img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; display: block; }
  .topbar-profile-menu { position: absolute; top: calc(100% + 6px); right: 0; background: var(--surface-card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); overflow: hidden; min-width: 160px; z-index: 50; }
  .topbar-profile-menu button { display: block; width: 100%; text-align: left; padding: 10px 14px; font-size: 12.5px; border: none; background: var(--surface-card); color: var(--text-primary); cursor: pointer; font-family: inherit; }
  .topbar-profile-menu button:hover { background: var(--surface-page); }
  .topbar-profile-menu button + button { border-top: 1px solid var(--gridline); }

  .nav-tabs { background: var(--surface-header); padding: 0 24px; display: flex; gap: 4px; border-top: 1px solid rgba(255,255,255,0.08); }
  .nav-tab { padding: 10px 16px; font-size: 13px; color: #b8b7ae; cursor: pointer; border-bottom: 2px solid transparent; user-select: none; }
  .nav-tab.active { color: #fff; border-bottom-color: var(--brand-orange); font-weight: 600; }
  .nav-tab:hover { color: #fff; }

  .wrap { max-width: 1360px; margin: 0 auto; padding: 20px 24px 60px; }

  .kpi-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 20px; }
  .kpi-tile { background: var(--surface-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi-tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .kpi-tile .value { font-size: 22px; font-weight: 700; }
  .kpi-tile .value.critical { color: var(--status-critical); }
  .kpi-tile .value.good { color: var(--success-text); }
  .kpi-tile.clickable { cursor: pointer; transition: border-color 0.15s, transform 0.15s; }
  .kpi-tile.clickable:hover { border-color: var(--brand-orange); transform: translateY(-2px); }
  .kpi-tile.highlight { background: color-mix(in srgb, var(--brand-orange) 10%, var(--surface-card)); border: 1.5px solid var(--brand-orange); position: relative; }
  .kpi-tile.highlight .label { color: color-mix(in srgb, var(--brand-orange) 70%, var(--text-secondary)); font-weight: 700; }
  .kpi-tile.highlight .value { color: var(--brand-orange); }
  .kpi-tile.highlight .sub { color: color-mix(in srgb, var(--brand-orange) 65%, var(--text-secondary)); font-weight: 600; }
  .kpi-tile.highlight:hover { transform: translateY(-2px); box-shadow: 0 6px 18px color-mix(in srgb, var(--brand-orange) 22%, transparent); }
  .kpi-tile .sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(13,13,13,0.55); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .hidden { display: none; }
  .modal-overlay.hidden { display: none; }
  .modal-card { background: var(--surface-card); border-radius: 14px; padding: 26px 28px; width: 640px; max-width: 92vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
  .modal-card h3 { margin: 0 0 4px; font-family: var(--font-display); }
  .modal-card .modal-sub { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 18px; }
  .modal-close-btn { position: relative; float: right; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-secondary); }
  .modal-close-btn:hover { color: var(--text-primary); }
  .hist-chart { display: flex; align-items: flex-end; gap: 6px; height: 160px; margin: 8px 0 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .hist-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; cursor: pointer; border-radius: 6px; padding-top: 4px; transition: background 0.12s; }
  .hist-bar-col:hover { background: color-mix(in srgb, var(--brand-orange) 8%, transparent); }
  .hist-bar { width: 100%; max-width: 26px; background: var(--brand-orange); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .hist-bar.zero { background: var(--border); }
  .hist-bar .n { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: 10.5px; font-weight: 700; color: var(--text-primary); }
  .hist-bar-label { font-size: 9.5px; color: var(--text-secondary); margin-top: 6px; writing-mode: vertical-rl; transform: rotate(180deg); height: 42px; }
  .hist-total-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-secondary); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .hist-hint { font-size: 11px; color: var(--text-secondary); margin: -2px 0 10px; }
  .modal-client-list { display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; }
  .modal-client-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: background 0.12s, border-color 0.12s; }
  .modal-client-row:hover { background: color-mix(in srgb, var(--brand-orange) 6%, transparent); border-color: color-mix(in srgb, var(--brand-orange) 40%, var(--border)); }
  .modal-client-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-orange); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .modal-client-info { flex: 1; min-width: 0; }
  .modal-client-nome { font-size: 13.5px; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-client-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
  .modal-client-empty { text-align: center; padding: 30px 0; font-size: 13px; color: var(--text-secondary); }

  /* ===== META TAB ===== */
  .meta-hero { display: flex; gap: 28px; align-items: center; background: linear-gradient(120deg, #1a1a1a 0%, #0d0d0d 60%); border-radius: 16px; padding: 28px 32px; margin-bottom: 20px; color: #fff; position: relative; overflow: hidden; }
  .meta-hero::before { content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(255,64,0,0.35) 0%, transparent 70%); }
  .meta-ring-wrap { position: relative; width: 128px; height: 128px; flex-shrink: 0; }
  .meta-ring-wrap svg { transform: rotate(-90deg); }
  .meta-ring-bg { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 10; }
  .meta-ring-fg { fill: none; stroke: var(--brand-orange); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
  .meta-ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .meta-ring-label .pct { font-size: 24px; font-weight: 800; }
  .meta-ring-label .txt { font-size: 10px; opacity: 0.75; }
  .meta-hero-info { position: relative; z-index: 1; flex: 1; }
  .meta-hero-info h2 { font-family: var(--font-display); margin: 0 0 4px; font-size: 22px; }
  .meta-hero-info p { margin: 0 0 12px; font-size: 13px; opacity: 0.82; max-width: 480px; }
  .meta-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .meta-badge.diamante { background: color-mix(in srgb, var(--brand-blue) 22%, transparent); color: var(--brand-blue); border: 1px solid color-mix(in srgb, var(--brand-blue) 45%, transparent); }
  .meta-badge.ouro { background: color-mix(in srgb, var(--brand-yellow) 24%, transparent); color: #ffd450; border: 1px solid rgba(255,212,80,0.45); }
  .meta-badge.prata { background: rgba(255,255,255,0.14); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
  .meta-badge.bronze { background: color-mix(in srgb, var(--brand-maroon) 30%, transparent); color: #e0a9b8; border: 1px solid rgba(224,169,184,0.35); }
  .meta-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .meta-kpi-card { background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .meta-kpi-card .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .meta-kpi-card .icon { font-size: 18px; }
  .meta-kpi-card .label { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  .meta-kpi-card .real-meta { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
  .meta-kpi-card .real { font-size: 21px; font-weight: 800; }
  .meta-kpi-card .meta-goal { font-size: 12.5px; color: var(--text-secondary); }
  .meta-bar-track { height: 7px; background: rgba(0,0,0,0.06); border-radius: 99px; overflow: hidden; }
  :root[data-theme="dark"] .meta-bar-track { background: rgba(255,255,255,0.10); }
  .meta-bar-fill { height: 100%; border-radius: 99px; }
  .meta-atingido-tag { font-size: 11px; font-weight: 700; margin-top: 6px; display: inline-block; }
  .meta-mock-flag { font-size: 9.5px; color: var(--text-secondary); background: var(--surface-page); border: 1px dashed var(--border); border-radius: 5px; padding: 1px 6px; font-weight: 600; }
  .meta-section-title { font-size: 13px; font-weight: 700; margin: 22px 0 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
  .meta-leaderboard { background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  .meta-lb-row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .meta-lb-row:last-child { border-bottom: none; }
  .meta-lb-row .rank { font-size: 15px; font-weight: 800; width: 26px; color: var(--text-secondary); }
  .meta-lb-row.rank-1 .rank { color: #ffd450; }
  .meta-lb-row.rank-2 .rank { color: var(--brand-gray); }
  .meta-lb-row.rank-3 .rank { color: var(--brand-maroon); }
  .meta-lb-row .nome { flex: 1; font-weight: 600; font-size: 13.5px; }
  .meta-lb-row .meta-bar-track { flex: 2; }
  .meta-lb-row .pct-num { width: 52px; text-align: right; font-size: 12.5px; font-weight: 700; }
  .meta-sync-box { background: color-mix(in srgb, var(--brand-blue) 8%, transparent); border: 1px solid color-mix(in srgb, var(--brand-blue) 30%, transparent); border-left: 4px solid var(--brand-blue); border-radius: 8px; padding: 14px 18px; font-size: 12.5px; line-height: 1.6; color: var(--text-primary); }
  .meta-sync-box strong { color: var(--brand-blue); }
  .meta-period-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 13px; flex-wrap: wrap; }
  .meta-period-row select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-card); color: var(--text-primary); font-size: 13px; cursor: pointer; }
  .meta-period-row .meta-period-hint { color: var(--text-secondary); font-size: 12px; }
  .meta-charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .meta-chart-card { background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .meta-chart-card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .meta-chart-card .head .title { font-size: 13px; font-weight: 700; }
  .meta-chart-legend { display: flex; gap: 14px; font-size: 11px; color: var(--text-secondary); }
  .meta-chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .meta-chart-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .meta-chart-legend .dash { width: 14px; height: 0; border-top: 2px dashed var(--brand-gray); display: inline-block; }
  .meta-line-chart { width: 100%; height: 130px; display: block; }
  .meta-chart-days { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-secondary); margin-top: 4px; }
  .meta-tables-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 8px; }
  .meta-table-card { background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .meta-table-card .title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .meta-mini-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .meta-mini-table th { text-align: left; color: var(--text-secondary); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--border); }
  .meta-mini-table td { padding: 6px 6px; border-bottom: 1px solid var(--border); }
  .meta-mini-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .meta-mini-table tr:last-child td { border-bottom: none; }
  .meta-empty-mini { font-size: 12px; color: var(--text-secondary); padding: 10px 0; }
  @media (max-width: 1100px) { .meta-charts-row, .meta-tables-row { grid-template-columns: 1fr; } }

  /* ===== MISSÕES (gamificação) ===== */
  .bell-btn { position: relative; background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 10px; width: 32px; height: 32px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .bell-btn:hover { background: rgba(255,255,255,0.08); }
  .bell-badge { position: absolute; top: -6px; right: -6px; background: var(--status-critical); color: #fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
  .bell-badge.hidden { display: none; }
  .missoes-points-row { display: flex; align-items: center; gap: 16px; background: linear-gradient(120deg, #1a1a1a 0%, #0d0d0d 60%); border-radius: 14px; padding: 18px 24px; margin-bottom: 18px; color: #fff; }
  .missoes-points-row .pts { font-size: 26px; font-weight: 800; }
  .missoes-points-row .pts-label { font-size: 11px; opacity: 0.75; }
  .missoes-points-row .sep { width: 1px; height: 34px; background: rgba(255,255,255,0.18); }
  .mission-card { background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; display: flex; gap: 14px; align-items: flex-start; }
  .mission-card.done { opacity: 0.6; }
  .mission-card .check-toggle { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 2px; background: var(--surface-page); }
  .mission-card.done .check-toggle { background: var(--status-good); border-color: var(--status-good); color: #fff; }
  .mission-card .body { flex: 1; }
  .mission-card .top-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .mission-card .titulo { font-weight: 700; font-size: 14px; }
  .mission-card.done .titulo { text-decoration: line-through; }
  .mission-card .desc { font-size: 12.5px; color: var(--text-secondary); margin: 4px 0 8px; }
  .mission-pts-tag { background: color-mix(in srgb, var(--brand-orange) 15%, transparent); color: var(--brand-orange); font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .mission-target-tag { font-size: 10.5px; color: var(--text-secondary); background: var(--surface-page); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; }
  .missoes-empty { font-size: 13px; color: var(--text-secondary); text-align: center; padding: 30px 0; }
  .mission-admin-form { background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 22px; }
  .mission-admin-form .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .mission-admin-form input, .mission-admin-form select, .mission-admin-form textarea { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-page); color: var(--text-primary); font-size: 13px; font-family: inherit; }
  .mission-admin-form textarea { width: 100%; min-height: 54px; resize: vertical; }
  .mission-admin-form button { background: var(--brand-orange); color: #fff; border: none; border-radius: 8px; padding: 9px 18px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .mission-admin-list-row { display: flex; align-items: center; gap: 12px; background: var(--surface-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
  .mission-admin-list-row .info { flex: 1; }
  .mission-admin-list-row .titulo { font-weight: 700; font-size: 13.5px; }
  .mission-admin-list-row .progress-mini { font-size: 11.5px; color: var(--text-secondary); margin-top: 3px; }
  .mission-admin-list-row .del-btn { border: none; background: none; color: var(--status-critical); cursor: pointer; font-size: 13px; }
  .mission-avatars { display: flex; gap: 4px; }
  .mission-avatars .m-av { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; background: var(--brand-gray); }
  .mission-avatars .m-av.done { background: var(--status-good); }

  /* ===== PERFIL — GALERIA DE CLIENTES ===== */
  .perfil-galeria-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .perfil-galeria-toolbar input[type=search] { flex: 1; max-width: 360px; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-card); color: var(--text-primary); font-size: 13px; }
  .perfil-galeria-count { font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; }
  .perfil-galeria-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }

  .auth-logo .flame { width: 26px; height: 26px; border-radius: 6px; }

  .auth-title { font-size: 30px; font-weight: 700; margin: 44px 0 8px; }
  .auth-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 26px; }
  .auth-field { margin-bottom: 16px; }
  .auth-field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .auth-input-wrap { position: relative; }
  .auth-input-wrap input { width: 100%; font-size: 14px; padding: 12px 40px 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-card); color: var(--text-primary); font-family: inherit; }
  .auth-input-wrap input:focus { outline: 2px solid var(--brand-orange); outline-offset: -1px; }
  .auth-eye-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 15px; color: var(--text-muted); padding: 4px; }
  .auth-error { font-size: 12.5px; color: var(--status-critical); margin: -8px 0 14px; min-height: 16px; }
  .auth-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 10px; }
  .auth-submit-btn { width: 100%; padding: 13px; border-radius: 8px; border: none; background: var(--surface-header); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 8px; }
  .auth-submit-btn:hover { opacity: 0.92; }
  .auth-right { flex: 1; position: relative; overflow: hidden; background: radial-gradient(circle at 30% 20%, #ff6a33 0%, var(--brand-orange) 45%, #d9330a 100%); display: flex; align-items: flex-end; }
  .auth-right::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 80% 85%, rgba(255,255,255,0.16) 0%, transparent 45%); }
  .auth-right-flame-bg { position: absolute; right: -14%; top: -12%; width: 68%; height: auto; color: #fff; opacity: 0.12; transform: rotate(-8deg); }
  .auth-right-flame-bg path { fill: currentColor; }
  .auth-right-copy { position: relative; z-index: 1; padding: 56px; color: #fff; }
  .auth-tagline { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1.08; margin: 0 0 16px; max-width: 460px; }
  .auth-right-sub { font-size: 14px; opacity: 0.92; max-width: 400px; margin: 0; line-height: 1.5; }
  @media (max-width: 860px) {
    .auth-screen { flex-direction: column; }
    .auth-left { flex: none; max-width: none; }
    .auth-right { min-height: 220px; }
  }

  /* ---- Profile picker screen ---- */
  .profiles-screen { min-height: 100vh; background: var(--surface-page); display: flex; flex-direction: column; align-items: center; padding: 64px 24px; }
  .profiles-logo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; margin-bottom: 8px; }
  .profiles-title { font-size: 24px; font-weight: 700; margin: 20px 0 4px; text-align: center; }
  .profiles-sub { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 36px; text-align: center; }
  .profiles-grid { display: grid; grid-template-columns: repeat(auto-fit, 140px); gap: 20px; justify-content: center; max-width: 700px; }
  .profile-card { background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; }
  .profile-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.10); border-color: var(--brand-orange); }
  .profile-card .avatar-wrap { position: relative; }
  .avatar-lg { width: 56px; height: 56px; border-radius: 50%; background: var(--brand-orange); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; overflow: hidden; }
  img.avatar-lg { object-fit: cover; }
  .avatar-edit-btn { position: absolute; bottom: -2px; right: -2px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .avatar-edit-btn:hover { background: var(--surface-page); }
  .profile-card .nome { font-size: 13.5px; font-weight: 700; text-align: center; }
  .profile-card .papel { font-size: 10.5px; color: var(--text-muted); text-align: center; line-height: 1.3; }
  @media (max-width: 800px) { .profiles-grid { grid-template-columns: repeat(2, 140px); } }

  /* ---- Consultant switcher (Amanda / coordenação) ---- */
  .consultant-switcher-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 12.5px; color: var(--text-secondary); }
  .consultant-switcher-row select { font-size: 12.5px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-card); color: var(--text-primary); font-family: inherit; }
  .carteira-empty-state { background: var(--surface-card); border: 1px dashed var(--border); border-radius: 12px; padding: 48px 24px; text-align: center; }
  .carteira-empty-state .icon { font-size: 34px; margin-bottom: 10px; }
  .carteira-empty-state h3 { margin: 0 0 8px; font-size: 16px; }
  .carteira-empty-state p { margin: 0 auto; max-width: 420px; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

  .boot-error { background: var(--brand-maroon); color: #fff; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; }

  @media (max-width: 900px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .crm-grid, .saude-grid { grid-template-columns: repeat(2, 1fr); }
    .team-row { grid-template-columns: 1fr; }
    .rotina-week-grid, .rotina-tipo-grid { grid-template-columns: 1fr; }
    .meta-kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div id="screenLogin"></div>
<div id="screenProfiles" style="display:none"></div>

<div id="appShell" style="display:none">
<div class="topbar">
  <div class="brand">
    <svg class="flame" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 2C11 8 8 12 8 18C8 23.52 11.58 28 16 28C20.42 28 24 23.52 24 18C24 14.2 21.6 11.2 19.2 9.2C19.9 12 18.2 14 18.2 14C18.2 14 18.6 9.4 16 2Z"/></svg>
    <div>
      <h1>Dashboard Onboarding</h1>
      <div class="sub" id="bootErrorSub"></div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="bell-btn" id="missionBellBtn" onclick="goToMissoes()" title="Missões da semana">🔔<span class="bell-badge hidden" id="missionBellBadge">0</span></button>
    <button class="theme-toggle" onclick="toggleTheme()">🌓 Modo escuro</button>
    <div class="topbar-profile-wrap">
      <button class="topbar-profile-btn" id="topbarProfileBtn" onclick="toggleProfileMenu(event)">
        <span class="topbar-avatar" id="topbarAvatar"></span>
        <span id="topbarProfileName"></span>
        <span class="chev">▾</span>
      </button>
      <div class="topbar-profile-menu hidden" id="topbarProfileMenu">
        <button onclick="backToProfiles()">🔁 Trocar perfil</button>
        <button onclick="logout()">🚪 Sair</button>
      </div>
    </div>
  </div>
</div>
<div class="nav-tabs">
  <div class="nav-tab" id="navCarteira" onclick="goScreen('carteira')">📋 Carteira</div>
  <div class="nav-tab" id="navPerfil" onclick="openPerfilGaleria()">👤 Perfil do Cliente</div>
  <div class="nav-tab" id="navMeta" onclick="goScreen('meta')">🎯 Meta</div>
  <div class="nav-tab" id="navAnalytics" onclick="goScreen('analytics')">📉 Analytics</div>
  <div class="nav-tab" id="navRotina" onclick="goScreen('rotina')">🧭 Rotina</div>
</div>

<div class="wrap">
  <div id="screenCarteira"></div>
  <div id="screenPerfil" style="display:none"></div>
  <div id="screenMeta" style="display:none"></div>
  <div id="screenAnalytics" style="display:none"></div>
  <div id="screenRotina" style="display:none"></div>
</div>
<div class="modal-overlay hidden" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal-card" id="modalCard"></div>
</div>
</div>
<div id="toast"></div>

<script>
  // ---------- Dados injetados pelo servidor (Código.gs / doGet) ----------
  // Chaves em português, com espaços/acentos — batem exatamente com o que a UI espera
  // (não reabrir esse mapeamento: já foi validado contra a planilha real).
  const PORTFOLIOS = {
    madu: <?!= maduJson ?>,
    pedro: <?!= pedroJson ?>,
    josiane: <?!= josianeJson ?>,
    ilana: <?!= ilanaJson ?>
  };
  const OVERLAY_DATA = <?!= overlayJson ?>;
  let missions = <?!= missoesJson ?>;
  const BOOT_ERROR = <?!= JSON.stringify(bootError) ?>;
</script>
<script>
  // ---------- google.script.run — wrapper fino ----------
  // Quando aberto fora do Apps Script (ex.: preview.html), google.script.run não
  // existe; a própria prévia local substitui esta função por uma versão mock.
  function gsRun(successCb, failureCb) {
    if (typeof google === "undefined" || !google.script || !google.script.run) {
      (failureCb || function () {})({ message: "google.script.run indisponível neste ambiente." });
      return { withSuccessHandler: function () { return this; }, withFailureHandler: function () { return this; } };
    }
    return google.script.run.withSuccessHandler(successCb).withFailureHandler(failureCb || function (err) {
      showToast("⚠️ Erro: " + (err && err.message ? err.message : err));
    });
  }

  function currentRows() {
    const key = activeConsultantKey();
    if (key === 'todos') return Object.values(PORTFOLIOS).flat();
    return PORTFOLIOS[key] || [];
  }

  // ============ AUTENTICAÇÃO (login → escolha de perfil) ============
  const FLAME_ICON = '<svg class="flame" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 2C11 8 8 12 8 18C8 23.52 11.58 28 16 28C20.42 28 24 23.52 24 18C24 14.2 21.6 11.2 19.2 9.2C19.9 12 18.2 14 18.2 14C18.2 14 18.6 9.4 16 2Z"/></svg>';
  const PROFILES = [
    { key: 'ilana', nome: 'Ilana', papel: 'Onboarder' },
    { key: 'pedro', nome: 'Pedro', papel: 'Onboarder' },
    { key: 'josiane', nome: 'Josiane', papel: 'Onboarder' },
    { key: 'madu', nome: 'Madu', papel: 'Onboarder' },
    { key: 'amanda', nome: 'Amanda', papel: 'Coordenadora · Administrador', isAdmin: true },
    { key: 'julia', nome: 'Julia', papel: 'Gerente de Onboarding · Administrador', isAdmin: true },
  ];
  let authState = { stage: 'login', profile: null, token: null, loginError: '', loginBusy: false, pwVisible: false, viewedConsultant: 'madu' };

  function loadProfilePhoto(key) {
    try { return localStorage.getItem('dboFoto_' + key) || ''; } catch (e) { return ''; }
  }
  function saveProfilePhoto(key, dataUrl) {
    try { localStorage.setItem('dboFoto_' + key, dataUrl); } catch (e) { showToast('Não foi possível salvar a foto (armazenamento local cheio).'); }
  }
  let profilePhotos = new Proxy({}, {
    get: function (_t, key) { return loadProfilePhoto(key); },
    set: function (_t, key, val) { saveProfilePhoto(key, val); return true; }
  });

  // ============ MISSÕES (gamificação) ============
  // destinatario: "todos" ou o key de um onboarder. completions: { [key]: true } — só
  // entra quem já concluiu. Toda mutação chama o Código.gs (token de sessão) e só
  // atualiza a tela depois da confirmação do servidor.
  function missionTier(points) {
    if (points >= 300) return { cls: 'diamante', label: '💎 Lenda da semana' };
    if (points >= 150) return { cls: 'ouro', label: '🥇 Ouro' };
    if (points >= 50) return { cls: 'prata', label: '🥈 Prata' };
    return { cls: 'bronze', label: '🌱 Iniciante' };
  }
  function missionsForConsultant(key) { return missions.filter(m => m.destinatario === 'todos' || m.destinatario === key); }
  function consultantPoints(key) { return missions.reduce((s,m) => s + (m.completions[key] ? m.pontos : 0), 0); }
  function pendingMissionsCount(key) { return missionsForConsultant(key).filter(m => !m.completions[key]).length; }
  function missionTargetKeys(m) { return m.destinatario === 'todos' ? PROFILES.filter(p => !p.isAdmin).map(p => p.key) : [m.destinatario]; }
  function toggleMissionComplete(id) {
    if (!authState.profile || authState.profile.isAdmin) return;
    const key = authState.profile.key;
    const m = missions.find(x => x.id === id);
    if (!m) return;
    const wasDone = !!m.completions[key];
    gsRun(res => {
      if (wasDone) delete m.completions[key]; else m.completions[key] = true;
      showToast(wasDone ? '↩️ Missão desmarcada' : `🎉 Missão concluída! +${m.pontos} pontos`);
      renderRotina();
      updateMissionBell();
    }).toggleMissionComplete(authState.token, id, key);
  }
  function createMission() {
    const tituloEl = document.getElementById('missionTitulo');
    const titulo = tituloEl.value.trim();
    if (!titulo) { showToast('⚠️ Dê um título pra missão antes de enviar'); return; }
    const descricao = document.getElementById('missionDescricao').value.trim();
    const pontos = Math.max(5, parseInt(document.getElementById('missionPontos').value, 10) || 10);
    const destinatario = document.getElementById('missionDestinatario').value;
    const missao = { titulo, descricao, pontos, destinatario };
    gsRun(res => {
      missions.unshift({ id: res.id, titulo, descricao, pontos, destinatario, criadoPor: authState.profile.nome, criadoEm: new Date().toISOString().slice(0,10), completions: {} });
      const alvoLabel = destinatario === 'todos' ? 'toda a equipe' : (PROFILES.find(p => p.key === destinatario) || {}).nome;
      showToast(`🔔 Missão enviada para ${alvoLabel} — alerta criado`);
      renderRotina();
      updateMissionBell();
    }).createMissao(authState.token, missao, authState.profile.nome);
  }
  function deleteMission(id) {
    gsRun(() => {
      missions = missions.filter(m => m.id !== id);
      renderRotina();
      updateMissionBell();
    }).deleteMissao(authState.token, id, authState.profile.nome);
  }
  function goToMissoes() { state.screen = 'rotina'; state.rotinaTab = 'missoes'; render(); }
  function updateMissionBell() {
    const badge = document.getElementById('missionBellBadge');
    if (!badge || !authState.profile) return;
    const isAmandaProfile = authState.profile.isAdmin;
    const count = isAmandaProfile
      ? missions.filter(m => missionTargetKeys(m).some(k => !m.completions[k])).length
      : pendingMissionsCount(authState.profile.key);
    badge.textContent = count;
    badge.classList.toggle('hidden', count === 0);
  }

  function avatarHtml(key, nome, cls) {
    const foto = profilePhotos[key];
    if (foto) return `<img class="${cls}" src="${foto}">`;
    return `<div class="${cls}">${initials(nome)}</div>`;
  }
  function triggerPhotoInput(e, key) {
    e.stopPropagation();
    document.getElementById('photoInput_' + key).click();
  }
  function onPhotoSelected(key, input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      profilePhotos[key] = e.target.result;
      renderProfiles();
      if (authState.profile && authState.profile.key === key) updateTopbarProfile();
    };
    reader.readAsDataURL(file);
  }

  function activeConsultantKey() {
    if (!authState.profile) return 'madu';
    return authState.profile.isAdmin ? authState.viewedConsultant : authState.profile.key;
  }
  function activeConsultantLabel() {
    const key = activeConsultantKey();
    if (key === 'todos') return 'Todos';
    const c = PROFILES.find(p => p.key === key);
    return c ? c.nome : '';
  }

  function renderLogin() {
    const el = document.getElementById('screenLogin');
    el.innerHTML = `
      <div class="auth-screen">
        <div class="auth-left">
          <div class="auth-left-inner">
            <div class="auth-top-row">
              <div class="auth-logo">${FLAME_ICON}hotmart</div>
            </div>
            <div class="auth-title">Entrar</div>
            <div class="auth-sub">Use a senha da equipe de onboarding para continuar</div>
            <div class="auth-field">
              <label>Senha</label>
              <div class="auth-input-wrap">
                <input id="loginPassword" type="${authState.pwVisible ? 'text' : 'password'}" placeholder="Senha da equipe" onkeydown="if(event.key==='Enter') submitLogin()">
                <button class="auth-eye-btn" onclick="togglePwVisibility()" title="Mostrar/ocultar senha">${authState.pwVisible ? '🙈' : '👁'}</button>
              </div>
            </div>
            <div class="auth-error">${authState.loginError || ''}</div>
            <button class="auth-submit-btn" onclick="submitLogin()" ${authState.loginBusy ? 'disabled' : ''}>${authState.loginBusy ? 'Entrando…' : 'Entrar'}</button>
          </div>
        </div>
        <div class="auth-right">
          <svg class="auth-right-flame-bg" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 2C11 8 8 12 8 18C8 23.52 11.58 28 16 28C20.42 28 24 23.52 24 18C24 14.2 21.6 11.2 19.2 9.2C19.9 12 18.2 14 18.2 14C18.2 14 18.6 9.4 16 2Z"/></svg>
          <div class="auth-right-copy">
            <div class="auth-tagline">Hotmart.<br>Aqui acontece.</div>
            <p class="auth-right-sub">Gestão de carteira, cronograma e CRM em um só lugar — acompanhe seus clientes de onboarding, o progresso do cronograma e a saúde da carteira sem sair de uma única tela.</p>
          </div>
        </div>
      </div>
    `;
  }
  function togglePwVisibility() {
    authState.pwVisible = !authState.pwVisible;
    const pw = document.getElementById('loginPassword');
    const val = pw ? pw.value : '';
    renderLogin();
    const pw2 = document.getElementById('loginPassword');
    if (pw2) { pw2.value = val; pw2.focus(); }
  }
  function submitLogin() {
    const pw = document.getElementById('loginPassword').value;
    authState.loginBusy = true;
    authState.loginError = '';
    renderLogin();
    gsRun(res => {
      authState.token = res.token;
      authState.loginError = '';
      authState.loginBusy = false;
      authState.stage = 'profiles';
      renderAuth();
    }, err => {
      authState.loginBusy = false;
      authState.loginError = (err && err.message) || 'Não foi possível entrar.';
      renderLogin();
    }).login(pw);
  }

  function renderProfiles() {
    const el = document.getElementById('screenProfiles');
    el.innerHTML = `
      <div class="profiles-screen">
        <div class="profiles-logo">${FLAME_ICON}hotmart</div>
        <div class="profiles-title">Quem está acessando?</div>
        <div class="profiles-sub">Escolha seu perfil para ver sua carteira, cronograma e rotina</div>
        <div class="profiles-grid">
          ${PROFILES.map(p => `
            <div class="profile-card" onclick="selectProfile('${p.key}')">
              <div class="avatar-wrap">
                ${avatarHtml(p.key, p.nome, 'avatar-lg')}
                <button class="avatar-edit-btn" onclick="triggerPhotoInput(event,'${p.key}')" title="Trocar foto">✏️</button>
                <input type="file" accept="image/*" id="photoInput_${p.key}" style="display:none" onclick="event.stopPropagation()" onchange="onPhotoSelected('${p.key}',this)">
              </div>
              <div class="nome">${p.nome}</div>
              <div class="papel">${p.papel}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
  function selectProfile(key) {
    authState.profile = PROFILES.find(p => p.key === key);
    authState.viewedConsultant = authState.profile.isAdmin ? 'madu' : key;
    authState.stage = 'app';
    renderAuth();
  }
  function backToProfiles() {
    authState.stage = 'profiles';
    authState.profile = null;
    document.getElementById('topbarProfileMenu').classList.add('hidden');
    renderAuth();
  }
  function logout() {
    const token = authState.token;
    authState = { stage: 'login', profile: null, token: null, loginError: '', loginBusy: false, pwVisible: false, viewedConsultant: 'madu' };
    renderAuth();
    if (token) gsRun(() => {}, () => {}).logout(token);
  }
  function toggleProfileMenu(e) {
    e.stopPropagation();
    document.getElementById('topbarProfileMenu').classList.toggle('hidden');
  }
  function openModal(html) {
    document.getElementById('modalCard').innerHTML = html;
    document.getElementById('modalOverlay').classList.remove('hidden');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.add('hidden');
  }
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('topbarProfileMenu');
    const btn = document.getElementById('topbarProfileBtn');
    if (menu && btn && !menu.classList.contains('hidden') && !menu.contains(e.target) && !btn.contains(e.target)) {
      menu.classList.add('hidden');
    }
  });
  function setViewedConsultant(key) {
    authState.viewedConsultant = key;
    render();
  }
  function updateTopbarProfile() {
    if (!authState.profile) return;
    const key = authState.profile.key;
    const avatarEl = document.getElementById('topbarAvatar');
    const foto = profilePhotos[key];
    if (foto) { avatarEl.innerHTML = `<img class="topbar-avatar-img" src="${foto}">`; }
    else { avatarEl.textContent = initials(authState.profile.nome); }
    document.getElementById('topbarProfileName').textContent = authState.profile.nome;
    updateMissionBell();
  }

  function renderAuth() {
    document.getElementById('screenLogin').style.display = authState.stage === 'login' ? 'block' : 'none';
    document.getElementById('screenProfiles').style.display = authState.stage === 'profiles' ? 'block' : 'none';
    document.getElementById('appShell').style.display = authState.stage === 'app' ? 'block' : 'none';
    if (authState.stage === 'login') renderLogin();
    else if (authState.stage === 'profiles') renderProfiles();
    else { updateTopbarProfile(); render(); }
  }

  function fmtCurrency(v) { if (v == null) return '—'; return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits: 0}); }
  function fmtNum(v) { if (v == null) return '—'; return v.toLocaleString('pt-BR'); }
  function fmtPct(v) { if (v == null) return '—'; return (v*100).toLocaleString('pt-BR', {maximumFractionDigits: 2}) + '%'; }
  function fmtId(v) { if (v == null) return '—'; return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function fmtDateBR(v) { if (!v) return '—'; const [y,m,d] = v.split('-'); return `${d}/${m}/${y}`; }
  function initials(name) { return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

  function statusBadge(status) {
    const map = {
      'Ready for Activation': ['badge-warning', '⏳'],
      'Activation & Monitoring': ['badge-progress', '📈'],
      'Accomplished': ['badge-good', '✅'],
      'Unaccomplished': ['badge-critical', '⛔'],
    };
    const [cls, icon] = map[status] || ['badge-muted', '—'];
    return `<span class="badge ${cls}">${icon} ${status || 'Sem status'}</span>`;
  }
  function statusColorVar(status) {
    const map = { 'Ready for Activation': '--status-warning', 'Activation & Monitoring': '--status-progress', 'Accomplished': '--status-good', 'Unaccomplished': '--status-critical' };
    return map[status] || '--text-muted';
  }
  function milestoneInfo(gmv) {
    gmv = gmv || 0;
    if (gmv >= 1000000) return {icon:'🏆', label:'Marco 1M atingido'};
    if (gmv >= 100000) return {icon:'🏅', label:'Marco 100k atingido'};
    if (gmv >= 10000) return {icon:'🔑', label:'Marco 10k atingido'};
    const pct = Math.min(100, Math.round((gmv/10000)*100));
    return {icon:null, label:`${pct}% até o marco de 10k`, pct};
  }
  function gmvCell(row) {
    const ms = milestoneInfo(row['GMV']);
    const extra = ms.icon ? `<div class="milestone">${ms.icon} ${ms.label}</div>`
      : `<div class="bar-track" style="margin-top:4px"><div class="bar-fill" style="width:${ms.pct}%;background:var(--brand-orange)"></div></div><div class="milestone">${ms.label}</div>`;
    return `${fmtCurrency(row['GMV'])}${extra}`;
  }

    const dc = row['Days carteira'] || 0;

    return {html: `<span class="badge badge-muted">Aguardando</span>`, alertLevel: 0};

  // ============ Overlay de CRM — cache local + persistência via Código.gs ============
  // OVERLAY_DATA (injetado no boot) só tem o que já estava salvo antes desta sessão.
  // clientOverlayCache é a fonte de verdade DEPOIS do boot: começa como cópia do que
  // veio do servidor, e cada edição atualiza o cache local E dispara saveOverlayFields
  // — otimista (a tela já reflete a mudança, o servidor confirma em paralelo).
  const clientOverlayCache = {};
  function getOverlayFor(id) {
    if (!clientOverlayCache[id]) {
      const fromServer = OVERLAY_DATA[id];
      clientOverlayCache[id] = fromServer ? JSON.parse(JSON.stringify(fromServer)) : {
        telefone: '', email: '', endereco: '', aniversario: '', evento: '', contrato: '',
        brinde: '', metaFaturamento: '', hotmartCast: '', hotmartCastData: '', hotmartCastHora: '',
        equipeExtra: [], relacExtra: [], fotos: []
      };
    }
    return clientOverlayCache[id];
  }
  function patchOverlay(id, patch) {
    Object.assign(getOverlayFor(id), patch);
    gsRun(() => {}, err => showToast('⚠️ Não salvou: ' + (err && err.message))).saveOverlayFields(authState.token, id, patch, authState.profile.nome);
  }

  // faseDatas/taskDatas do Cronograma são só um lembrete SIMULADO (a especificação do
  // produto marca isso como ilustrativo — não existe integração real de calendário
  // aqui). Por isso ficam no localStorage do navegador, não na planilha.
  function cronogramaStorageKey(clientId) { return 'dboCronograma_' + clientId; }
  function loadCronogramaOverride(clientId) {
    try { return JSON.parse(localStorage.getItem(cronogramaStorageKey(clientId)) || 'null') || { faseDatas: {}, taskDatas: {} }; }
    catch (e) { return { faseDatas: {}, taskDatas: {} }; }
  }
  function saveCronogramaOverride(clientId, ov) { try { localStorage.setItem(cronogramaStorageKey(clientId), JSON.stringify(ov)); } catch (e) {} }

  function cronogramaForClient(row) {
    const pct = row['_cronogramaProgress'];
    const doneCount = Math.round((pct/100) * TOTAL_TASKS);
    const ov = loadCronogramaOverride(row['Hotmart ID']);
    let counter = 0;
    const fases = FASES_TEMPLATE.map((f, faseIdx) => {
      const tarefas = f.tarefas.map((nome, taskIdx) => {
        counter++;
        const done = counter <= doneCount;
        const daysAgo = done ? Math.max(1, Math.round((TOTAL_TASKS - counter) * 2.2)) : null;
        const taskKey = `${faseIdx}_${taskIdx}`;
        const data = ov.taskDatas[taskKey] || null;
        return { nome, done, daysAgo, data, taskKey };
      });
      const faseDone = tarefas.filter(t => t.done).length;
      const facePctDone = Math.round(100 * faseDone / tarefas.length);
      const faseDate = ov.faseDatas[faseIdx] || null;
      return { titulo: f.titulo, tarefas, pct: facePctDone, faseIdx, faseDate };
    });
    return fases;
  }
  function scheduleFaseDate(clientId, faseIdx, value) {
    const ov = loadCronogramaOverride(clientId);
    ov.faseDatas[faseIdx] = value;
    saveCronogramaOverride(clientId, ov);
    const fase = FASES_TEMPLATE[faseIdx];
    if (value) showToast(`📅 Lembrete simulado — Fase ${faseIdx+1} (${fase.titulo}) em ${fmtDateBR(value)}`);
    renderPerfil();
  }
  function scheduleTaskDate(clientId, faseIdx, taskIdx, value) {
    const ov = loadCronogramaOverride(clientId);
    ov.taskDatas[`${faseIdx}_${taskIdx}`] = value;
    saveCronogramaOverride(clientId, ov);
    const nome = FASES_TEMPLATE[faseIdx].tarefas[taskIdx];
    if (value) showToast(`📅 Lembrete simulado — "${nome}" em ${fmtDateBR(value)}`);
    renderPerfil();
  }

  function crmMockForClient(row) {
    const id = row['Hotmart ID'];
    const slug = (row['Nome']||'cliente').toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,'');
    const idNum = String(Math.round(id||0));
    const defaults = {
      telefone: `(11) 9${idNum.slice(-4)}-${idNum.slice(-8,-4).padStart(4,'0')}`,
      email: `contato@${slug.split('.')[0]||'cliente'}.com.br`,
      endereco: `${row['UF'] || 'BR'}, Brasil`,
      aniversario: '',
      evento: row['GMV'] > 100000 ? 'Sim' : 'Não',
      contrato: row['Status'] !== 'Unaccomplished' ? 'Assinado' : 'Pendente',
      brinde: row['GMV'] >= 10000 ? 'Enviado' : 'Não enviado',
      metaFaturamento: row['Amount 12 meses'] || 0,
      hotmartCast: 'Não',
      hotmartCastData: '',
      hotmartCastHora: '',
    };
    const saved = getOverlayFor(id);
    const merged = {};
    Object.keys(defaults).forEach(k => { merged[k] = (saved[k] !== undefined && saved[k] !== '') ? saved[k] : defaults[k]; });
    const equipeBase = [
      { nome: row['Nome'], cargo: 'Responsável pela conta', telefone: '' },
      { nome: row['SDR'] || 'Contato comercial', cargo: 'Ponto de contato inicial', telefone: '' },
    ];
    return {
      ...merged,
      equipe: equipeBase.concat(saved.equipeExtra || []),
      acoes: [
        { data: row['_ultimoContatoData'], descricao: 'Contato de acompanhamento — alinhamento de próximos passos' },
        { data: row['OP'], descricao: 'Abertura de oportunidade registrada' },
        { data: row['CW'], descricao: 'Contract Won — início da parceria' },
      ],
      relacoes: saved.relacExtra || [],
      fotos: saved.fotos || [],
    };
  }

  const fotosCache = {}; // hotmartId -> array com dataURL, ou undefined enquanto carrega
  function ensureFotosLoaded(clientId) {
    if (fotosCache[clientId] !== undefined) return;
    fotosCache[clientId] = null; // marca "carregando" — evita disparar 2x
    gsRun(fotos => {

  function resizeImageFile(file, maxDim, quality, cb) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  function triggerClientPhotoInput(clientId) {
    document.getElementById('clientPhotoInput_' + clientId).click();
  }
  function onClientPhotoSelected(clientId, input) {
    const files = Array.from(input.files || []);
    if (!files.length) return;
    const hoje = new Date().toISOString().slice(0, 10);
    let pending = files.length;
    files.forEach(file => {
      resizeImageFile(file, 1600, 0.82, dataUrl => {
        gsRun(res => {
          const ov = getOverlayFor(clientId);
          ov.fotos = [res.foto].concat(ov.fotos || []);
          if (fotosCache[clientId]) fotosCache[clientId] = [{ ...res.foto, dataUrl: res.dataUrl }].concat(fotosCache[clientId]);
          pending--;
          if (pending === 0) { showToast(`📸 ${files.length} foto${files.length===1?'':'s'} adicionada${files.length===1?'':'s'}`); renderPerfil(); }
        }).uploadClientPhoto(authState.token, clientId, dataUrl, file.name, '', hoje, authState.profile.nome);

    });

  }

  const MONTH_NAMES_BR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

  function novosClientesPorMes(rows) {

  function computeKPIs(rows) {
    const total = rows.length;
    const gmvTotal = rows.reduce((s,r)=> s + (r['GMV']||0), 0);
    const avgProgress = Math.round(rows.reduce((s,r)=> s + r['_cronogramaProgress'], 0) / (total||1));
    const alerts = rows.filter(r => activationCell(r).alertLevel > 0).length;
    const critAlerts = rows.filter(r => activationCell(r).alertLevel === 2).length;
    const novosMap = novosClientesPorMes(rows);
    const novosMes = novosMap[currentMonthKey()] || 0;
    return `
      <div class="kpi-tile"><div class="label">Clientes na carteira</div><div class="value">${fmtNum(total)}</div></div>
      <div class="kpi-tile"><div class="label">GMV total</div><div class="value">${fmtCurrency(gmvTotal)}</div></div>
      <div class="kpi-tile"><div class="label">Progresso médio do cronograma</div><div class="value">${avgProgress}%</div></div>
      <div class="kpi-tile"><div class="label">Em alerta de prazo</div><div class="value ${critAlerts>0?'critical':''}">${alerts}</div></div>
      <div class="kpi-tile"><div class="label">Responsável</div><div class="value" style="font-size:16px">${activeConsultantLabel()}</div></div>
      <div class="kpi-tile clickable highlight" onclick="openNovosClientesModal()"><div class="label">🔥 Novos clientes (mês atual)</div><div class="value">${fmtNum(novosMes)}</div><div class="sub">📊 ver histórico por mês</div></div>
    `;
  }
  function openNovosClientesModal() {
    const rows = currentRows();
    const map = novosClientesPorMes(rows);
    const keys = Object.keys(map).sort();
    const maxVal = Math.max(1, ...Object.values(map));
    const recent = keys.slice(-12);
    const total = keys.reduce((s,k)=> s + map[k], 0);
    const bars = recent.map(mk => `
      <div class="hist-bar-col" onclick="openNovosClientesMesModal('${mk}')" title="Ver clientes de ${monthLabelBR(mk)}">
        <div class="hist-bar${map[mk]?'':' zero'}" style="height:${Math.max(4, Math.round((map[mk]/maxVal)*130))}px"><span class="n">${map[mk]}</span></div>
        <div class="hist-bar-label">${monthLabelBR(mk)}</div>
      </div>
    `).join('');
    openModal(`
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <h3>Novos clientes por mês — ${activeConsultantLabel()}</h3>
      <p class="modal-sub">Contagem baseada na data de entrada na carteira (coluna <strong>CW</strong> da planilha) — dado real, sem estimativa.</p>
      ${recent.length ? `<div class="hist-chart">${bars}</div><p class="hist-hint">Clique num mês pra ver quais clientes entraram nele.</p>` : `<p style="font-size:13px;color:var(--text-secondary)">Sem histórico de entradas para esse consultor ainda.</p>`}
      <div class="hist-total-row"><span>Total no histórico (${keys.length} meses com entradas)</span><span><strong>${fmtNum(total)}</strong> clientes</span></div>
    `);
  }
  function openNovosClientesMesModal(mk) {
    const rows = currentRows();
    const clientes = rows.filter(r => monthKeyOf(r['CW']) === mk).sort((a,b) => (a['CW'] < b['CW'] ? 1 : -1));
    openModal(`
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <div class="back-link" onclick="openNovosClientesModal()">← Voltar para o histórico por mês</div>
      <h3>Novos clientes em ${monthLabelBR(mk)}</h3>
      <p class="modal-sub">${fmtNum(clientes.length)} cliente${clientes.length===1?'':'s'} que entraram na carteira de ${activeConsultantLabel()} nesse mês, pela data real de CW. Clique num cliente pra abrir o perfil completo.</p>
      ${clientes.length ? `<div class="modal-client-list">${clientes.map(r => `
        <div class="modal-client-row" onclick="closeModal(); openPerfil(${r['Hotmart ID']}, 'carteira')">
          <div class="modal-client-avatar">${initials(r['Nome'])}</div>
          <div class="modal-client-info">
            <div class="modal-client-nome">${r['Nome']}</div>
            <div class="modal-client-sub">#${fmtId(r['Hotmart ID'])} · entrou em ${fmtDateBR(r['CW'])}</div>
          </div>
          ${statusBadge(r['Status'])}
        </div>
      `).join('')}</div>` : `<div class="modal-client-empty">Nenhum cliente encontrado pra esse mês.</div>`}
    `);
  }
  function applyFilters() {
    return currentRows().filter(r => {
      if (state.search && !(r['Nome']||'').toLowerCase().includes(state.search.toLowerCase())) return false;
      if (state.statusFilter.size < ALL_STATUS_VALUES.length && !state.statusFilter.has(r['Status'] ?? null)) return false;
      if (state.closerFilter.size < ALL_CLOSER_VALUES.length && !state.closerFilter.has(r['Closer'] || null)) return false;
      if (state.milestoneFilter.size < ALL_MILESTONE_VALUES.length && !state.milestoneFilter.has(milestoneBucket(r['GMV']))) return false;
      if (state.alertOnly && activationCell(r).alertLevel === 0) return false;
      return true;
    });
  }
  function sortRows(rows) {
    const dir = state.sortDir === 'asc' ? 1 : -1;
    const getVal = state.sortKey === '__name' ? (r => r['Nome'] || '')
      : state.sortKey === '__id' ? (r => r['Hotmart ID'] || 0)
      : (colByKey(state.sortKey) || {}).sortValue;
    if (!getVal) return rows;
    return rows.slice().sort((a,b) => {
      let av = getVal(a), bv = getVal(b);
      if (av === null || av === undefined) av = -Infinity;
      if (bv === null || bv === undefined) bv = -Infinity;
      if (typeof av === 'string') return av.localeCompare(bv) * dir;
      return (av - bv) * dir;
    });
  }
  function renderHead(visible) {
    const ths = [`<th data-pin="id">ID</th>`, `<th data-pin="name">Cliente</th>`]
      .concat(visible.map(c => `<th data-key="${c.key}" class="${c.numeric?'num':''}" style="cursor:pointer" onclick="setSort('${c.key}')">${c.label}${state.sortKey===c.key?(state.sortDir==='desc'?' ▾':' ▴'):''}</th>`));
    return `<tr>${ths.join('')}</tr>`;
  }
  function setSort(key) {
    if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    else { state.sortKey = key; state.sortDir = 'desc'; }
    renderCarteira();
  }

    document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; renderCarteira(); });

    document.getElementById('alertToggle').addEventListener('click', () => { state.alertOnly = !state.alertOnly; renderCarteira(); });

  function renderColPanel() {
    const panel = document.getElementById('colPanel'); if (!panel) return;
    const groups = COLUMN_GROUPS.map(group => {
      const cols = COLUMNS.filter(c => c.group === group);
      if (!cols.length) return '';
      const items = cols.map(c => `<label class="col-check"><input type="checkbox" data-colkey="${c.key}" ${state.visibleColumns.has(c.key)?'checked':''}> ${c.label}</label>`).join('');

    }).join('');

  // ============ META ============
  // Atingimento = GMV / Amount 3 meses (mesma fórmula da Saúde da Carteira, já
  // validada). Ativação vem direto da coluna real "Ativação". Ferramentas e Bônus
  // ainda não existem nessa planilha — ilustrativos (🧪) até a integração com o
  // Power BI existir.
  function seededPct(seedStr, min, max) {
    let h = 0;
    for (let i = 0; i < seedStr.length; i++) { h = (h * 31 + seedStr.charCodeAt(i)) >>> 0; }
    return min + (h % 1000) / 1000 * (max - min);
  }
  function metaMetricsFor(key, rows) {
    const total = rows.length;
    const ativados = rows.filter(r => !!r['Ativação']).length;
    const gmvReal = rows.reduce((s,r)=> s + (r['GMV']||0), 0);
    const gmvMeta = rows.reduce((s,r)=> s + (r['Amount 3 meses']||0), 0);
    const atingidoPct = gmvMeta > 0 ? gmvReal / gmvMeta : 0;
    const ativacaoMeta = Math.max(1, Math.round(total * 0.85));
    const ativacaoPct = ativacaoMeta > 0 ? ativados / ativacaoMeta : 0;
    const ferramentasPct = total > 0 ? seededPct(key + 'ferramentas', 0.55, 0.97) : 0;
    const overall = total > 0 ? (Math.min(1.3,atingidoPct)*0.5 + Math.min(1.3,ativacaoPct)*0.3 + ferramentasPct*0.2) : 0;
    return { total, ativados, ativacaoMeta, ativacaoPct, gmvReal, gmvMeta, atingidoPct, ferramentasPct, overall };
  }
  function badgeTier(overall) {
    if (overall >= 1.0) return { cls: 'diamante', label: '💎 Diamante' };
    if (overall >= 0.85) return { cls: 'ouro', label: '🥇 Ouro' };
    if (overall >= 0.65) return { cls: 'prata', label: '🥈 Prata' };
    return { cls: 'bronze', label: '🥉 Bronze' };
  }
  function metaBarColor(pct) {
    if (pct >= 1) return 'var(--status-good)';
    if (pct >= 0.7) return 'var(--status-warning)';
    return 'var(--status-critical)';
  }
  function metaKpiCard(icon, label, real, meta, pct, mock) {
    const pctLabel = fmtPct(pct);
    return `
      <div class="meta-kpi-card">
        <div class="top"><span class="icon">${icon}</span>${mock ? '<span class="meta-mock-flag">🧪 ilustrativo</span>' : ''}</div>
        <div class="label">${label}</div>
        <div class="real-meta"><span class="real">${real}</span><span class="meta-goal">meta ${meta}</span></div>
        <div class="meta-bar-track"><div class="meta-bar-fill" style="width:${Math.min(100,Math.round(pct*100))}%;background:${metaBarColor(pct)}"></div></div>
        <span class="meta-atingido-tag" style="color:${metaBarColor(pct)}">${pctLabel} atingido</span>
      </div>
    `;
  }
  function daysInMonth(mk) { const [y,mo] = mk.split('-').map(Number); return new Date(y, mo, 0).getDate(); }
  function lastNMonthKeys(n) {
    const out = []; const d = new Date(); d.setDate(1);
    for (let i = 0; i < n; i++) { out.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')); d.setMonth(d.getMonth() - 1); }
    return out.reverse();
  }
  function setMetaPeriod(v) { state.metaPeriod = v; renderMeta(); }
  function metaPeriodMetrics(key, rows, period) {
    const total = rows.length;
    const nDays = daysInMonth(period);
    const ativadosPeriodo = rows.filter(r => monthKeyOf(r['Ativação']) === period);
    const gmvMetaTotal = rows.reduce((s,r)=> s + (r['Amount 3 meses']||0), 0);
    const ativacaoMetaPeriodo = Math.max(1, Math.round(total * 0.85 / 12));
    const gmvMetaPeriodo = Math.round((gmvMetaTotal || 0) / 12) || 1;
    const gmvRealPeriodo = ativadosPeriodo.reduce((s,r)=> s + (r['GMV']||0), 0);
    const ativacaoPctPeriodo = ativacaoMetaPeriodo > 0 ? ativadosPeriodo.length / ativacaoMetaPeriodo : 0;
    const atingidoGmvPctPeriodo = gmvMetaPeriodo > 0 ? gmvRealPeriodo / gmvMetaPeriodo : 0;
    const ferramentasPct = total > 0 ? seededPct(key + 'ferramentas' + period, 0.5, 0.97) : 0;
    const bonusMetaPeriodo = Math.round((gmvMetaPeriodo || 5000) * 0.008 / 100) * 100 || 300;
    const bonusRealPeriodo = Math.round(bonusMetaPeriodo * Math.min(1.3, Math.max(0.1, atingidoGmvPctPeriodo)) / 10) * 10;

    const byDay = Array(nDays + 1).fill(0), gmvByDay = Array(nDays + 1).fill(0);
    ativadosPeriodo.forEach(r => {
      const day = parseInt((r['Ativação']||'').slice(8,10), 10);
      if (day >= 1 && day <= nDays) { byDay[day] += 1; gmvByDay[day] += (r['GMV']||0); }
    });
    const cumAtivacao = [], cumGmv = [];
    let runA = 0, runG = 0;
    for (let d = 1; d <= nDays; d++) { runA += byDay[d]; cumAtivacao.push(runA); runG += gmvByDay[d]; cumGmv.push(runG); }
    const goalAtivacao = cumAtivacao.map((_,i) => (ativacaoMetaPeriodo / nDays) * (i + 1));
    const goalGmv = cumGmv.map((_,i) => (gmvMetaPeriodo / nDays) * (i + 1));

    const ativadosList = ativadosPeriodo.slice().sort((a,b) => (a['Ativação'] < b['Ativação'] ? 1 : -1));
    const paraAtivar = rows.filter(r => !r['Ativação'])
      .map(r => ({ row: r, gmvFaltante: Math.max(0, (r['Amount 3 meses']||0) - (r['GMV']||0)) }))
      .sort((a,b) => b.gmvFaltante - a.gmvFaltante).slice(0, 8);

    return { nDays, ativadosPeriodo, ativacaoMetaPeriodo, ativacaoPctPeriodo, gmvRealPeriodo, gmvMetaPeriodo, atingidoGmvPctPeriodo, ferramentasPct, bonusMetaPeriodo, bonusRealPeriodo, cumAtivacao, cumGmv, goalAtivacao, goalGmv, ativadosList, paraAtivar };
  }
  function sparklineSvg(actual, goal, color) {
    const W = 560, H = 130;
    const maxV = Math.max(1, ...actual, ...goal);
    const n = actual.length;
    const stepX = n > 1 ? W / (n - 1) : W;
    const toY = v => (H - (v / maxV) * H).toFixed(1);
    const pt = (arr) => arr.map((v,i) => `${(i*stepX).toFixed(1)},${toY(v)}`).join(' ');
    const ptsActual = pt(actual), ptsGoal = pt(goal);
    const areaPath = `M0,${H} L${ptsActual} L${(W).toFixed(1)},${H} Z`;
    return `
      <svg class="meta-line-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <polyline points="${ptsGoal}" fill="none" stroke="var(--brand-gray)" stroke-width="2" stroke-dasharray="6,5" vector-effect="non-scaling-stroke"></polyline>
        <path d="${areaPath}" fill="${color}" opacity="0.14"></path>
        <polyline points="${ptsActual}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke"></polyline>
      </svg>
    `;
  }
  function metaChartDaysAxis(nDays) {
    const marks = [1, 5, 10, 15, 20, 25, nDays].filter((v,i,arr) => arr.indexOf(v) === i && v <= nDays);
    return `<div class="meta-chart-days">${marks.map(d => `<span>${d}</span>`).join('')}</div>`;
  }

      <div class="meta-kpi-row">
        ${metaKpiCard('🚀', '# Ativação', fmtNum(pm.ativadosPeriodo.length), fmtNum(pm.ativacaoMetaPeriodo), pm.ativacaoPctPeriodo, false)}
        ${metaKpiCard('🛠️', '% Ferramentas', fmtPct(pm.ferramentasPct), '100%', pm.ferramentasPct, true)}
        ${metaKpiCard('💰', 'Receita (GMV)', fmtCurrency(pm.gmvRealPeriodo), fmtCurrency(pm.gmvMetaPeriodo), pm.atingidoGmvPctPeriodo, false)}
        ${metaKpiCard('🏆', 'Bônus', fmtCurrency(pm.bonusRealPeriodo), fmtCurrency(pm.bonusMetaPeriodo), pm.bonusRealPeriodo/pm.bonusMetaPeriodo, true)}
      </div>
      <div class="meta-charts-row">
        <div class="meta-chart-card">
          <div class="head"><span class="title">Ativação — acumulado em ${monthLabelBR(period)}</span>
            <span class="meta-chart-legend"><span><i class="dot" style="background:var(--brand-orange)"></i>Real</span><span><i class="dash"></i>Meta</span></span>
          </div>
          ${sparklineSvg(pm.cumAtivacao, pm.goalAtivacao, 'var(--brand-orange)')}
          ${metaChartDaysAxis(pm.nDays)}
        </div>
        <div class="meta-chart-card">
          <div class="head"><span class="title">Receita (GMV) — acumulado em ${monthLabelBR(period)}</span>
            <span class="meta-chart-legend"><span><i class="dot" style="background:var(--brand-blue)"></i>Real</span><span><i class="dash"></i>Meta</span></span>
          </div>
          ${sparklineSvg(pm.cumGmv, pm.goalGmv, 'var(--brand-blue)')}
          ${metaChartDaysAxis(pm.nDays)}
        </div>
      </div>
      <div class="meta-tables-row">
        <div class="meta-table-card">
          <div class="title">✅ Clientes ativados${isCurrentPeriod ? ' este mês' : ` — ${monthLabelBR(period)}`}</div>
          ${ativadosTableHtml(pm.ativadosList)}
        </div>
        <div class="meta-table-card">
          <div class="title">🎯 Clientes para ativar (maior GMV faltante)</div>
          ${paraAtivarTableHtml(pm.paraAtivar)}
        </div>
      </div>
      ${leaderboardHtml}
      <div class="meta-section-title">Integração com o Power BI</div>
      <div class="meta-sync-box">
        🔄 Hoje a meta e o atingimento são calculados manualmente no Power BI (dashboard "Remuneração Variável Onboarding"). Ativação, Receita e as tabelas de clientes acima já são <strong>dados reais</strong> da planilha (filtrados pelo período escolhido); os campos marcados com <strong>🧪 ilustrativo</strong> (Ferramentas e Bônus) ainda não existem nessa planilha e são só exemplos de layout até uma integração de verdade existir.
      </div>
    `;
  }

  // ============ ANALYTICS (protótipo visual — futura integração Astrobox) ============
  function clientDropSeries(row, months) {
    months = months || 6;
    const id = String(row['Hotmart ID']);
    const atual = row['GMV'] || 0;
    const trendPct = seededPct('drop' + id, -0.5, 0.3);
    const anterior = atual / (1 + trendPct);
    const series = [];
    for (let i = 0; i < months; i++) {
      const t = i / (months - 1);
      const base = anterior + (atual - anterior) * t;
      const noise = seededPct('noise' + id + i, -0.06, 0.06) * (anterior || 1);
      series.push(Math.max(0, base + noise));
    }
    series[series.length - 1] = atual;
    return { trendPct, anterior, atual, series };
  }
  function miniSparkline(series, color) {
    const W = 90, H = 26;
    const maxV = Math.max(1, ...series), minV = Math.min(0, ...series);
    const range = Math.max(1, maxV - minV);
    const n = series.length;
    const stepX = n > 1 ? W / (n - 1) : W;
    const pts = series.map((v,i) => `${(i*stepX).toFixed(1)},${(H - ((v-minV)/range)*H).toFixed(1)}`).join(' ');
    return `<svg class="mini-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"></polyline></svg>`;
  }
  function singleLineSvg(series, color) {
    const W = 1160, H = 130;
    const maxV = Math.max(1, ...series);
    const rawMin = Math.min(...series);
    const pad = (maxV - rawMin) * 0.15 || maxV * 0.05;
    const minV = Math.max(0, rawMin - pad);
    const range = Math.max(1, (maxV + pad) - minV);
    const n = series.length;
    const stepX = n > 1 ? W / (n - 1) : W;
    const toY = v => (H - ((v - minV) / range) * H).toFixed(1);
    const pts = series.map((v,i) => `${(i*stepX).toFixed(1)},${toY(v)}`).join(' ');
    const areaPath = `M0,${H} L${pts} L${W.toFixed(1)},${H} Z`;
    return `
      <svg class="meta-line-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <path d="${areaPath}" fill="${color}" opacity="0.14"></path>
        <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke"></polyline>
      </svg>
    `;
  }
  function dropBadge(trendPct) {
    if (trendPct <= -0.25) return { cls: 'critical', label: '🔴 Queda crítica' };
    if (trendPct <= -0.08) return { cls: 'warning', label: '🟡 Em queda' };
    if (trendPct >= 0.08) return { cls: 'good', label: '🟢 Crescendo' };
    return { cls: 'neutral', label: '⚪ Estável' };
  }
  function renderAnalytics() {
    const el = document.getElementById('screenAnalytics');
    const allRows = currentRows();
    if (allRows.length === 0) {
      el.innerHTML = `
        ${consultantSwitcherHtml()}
        <div class="carteira-empty-state">
          <div class="icon">📉</div>
          <h3>Analytics de ${activeConsultantLabel()} ainda não existe</h3>
          <p>Assim que a carteira desse consultor existir, essa aba passa a mostrar a tendência de vendas automaticamente.</p>
        </div>
      `;
      return;
    }
    const rows = allRows.filter(r => JORNADA_STATUS_VALUES.includes(r['Status']));
    if (rows.length === 0) {
      el.innerHTML = `
        ${consultantSwitcherHtml()}
        <div class="carteira-empty-state">
          <div class="icon">📉</div>
          <h3>Nenhum cliente na jornada ativa agora</h3>
          <p>O Analytics olha só pra quem está em Pre Onboarding, Welcome, Product Migration, Ready for Activation ou Activation & Monitoring — ${activeConsultantLabel()} não tem ninguém nesses status no momento.</p>
        </div>
      `;
      return;
    }
    const months = 6;
    const withDrop = rows.map(r => ({ row: r, ...clientDropSeries(r, months) }));
    const emQueda = withDrop.filter(x => x.trendPct <= -0.08);
    const maiorQueda = withDrop.reduce((worst,x) => x.trendPct < worst.trendPct ? x : worst, withDrop[0]);
    const gmvEmRisco = emQueda.reduce((s,x) => s + x.atual, 0);
    const piores = withDrop.slice().sort((a,b) => a.trendPct - b.trendPct).slice(0, 10);
    const portfolioSeries = Array(months).fill(0);
    withDrop.forEach(x => x.series.forEach((v,i) => portfolioSeries[i] += v));
    const mkeys = lastNMonthKeys(months);

    el.innerHTML = `
      ${consultantSwitcherHtml()}
      <div class="meta-sync-box" style="margin-bottom:18px;border-left-color:var(--brand-purple);background:color-mix(in srgb, var(--brand-purple) 8%, transparent);border-color:color-mix(in srgb, var(--brand-purple) 30%, transparent)">
        🧪 <strong>Protótipo visual</strong> — essa aba mostra como ficaria uma visão de Analytics de queda de vendas com integração ao <strong>Astrobox</strong>. A planilha de hoje só tem uma foto do GMV de cada cliente, não um histórico mês a mês — então a tendência abaixo é ilustrativa, só para validar o layout. Escopo: só clientes na <strong>jornada ativa</strong> — ${fmtNum(rows.length)} de ${fmtNum(allRows.length)} da carteira.
      </div>
      <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)">
        <div class="kpi-tile"><div class="label">Clientes em queda</div><div class="value critical">${fmtNum(emQueda.length)}</div><div class="sub">de ${fmtNum(rows.length)} na jornada ativa</div></div>
        <div class="kpi-tile"><div class="label">Maior queda</div><div class="value critical">${fmtPct(maiorQueda.trendPct)}</div><div class="sub">${maiorQueda.row['Nome']}</div></div>
        <div class="kpi-tile"><div class="label">GMV em risco</div><div class="value critical">${fmtCurrency(gmvEmRisco)}</div><div class="sub">soma dos clientes em queda</div></div>
      </div>
      <div class="meta-chart-card" style="margin-bottom:20px">
        <div class="head"><span class="title">GMV da carteira — últimos 6 meses <span class="meta-mock-flag">🧪 ilustrativo</span></span></div>
        ${singleLineSvg(portfolioSeries, 'var(--brand-purple)')}
        <div class="meta-chart-days">${mkeys.map(mk => `<span>${monthLabelBR(mk)}</span>`).join('')}</div>
      </div>
      <div class="meta-section-title">Clientes com maior queda</div>
      <div class="meta-table-card">
        <table class="meta-mini-table">
          <thead><tr><th>Cliente</th><th>Tendência (6m)</th><th class="num">GMV anterior</th><th class="num">GMV atual</th><th class="num">Variação</th><th>Status</th></tr></thead>
          <tbody>
            ${piores.map(x => { const b = dropBadge(x.trendPct); return `
              <tr onclick="openPerfil(${x.row['Hotmart ID']}, 'carteira')" style="cursor:pointer">
                <td>${x.row['Nome']}</td>
                <td>${miniSparkline(x.series, x.trendPct < 0 ? 'var(--status-critical)' : 'var(--status-good)')}</td>
                <td class="num">${fmtCurrency(x.anterior)}</td>
                <td class="num">${fmtCurrency(x.atual)}</td>
                <td class="num" style="color:${x.trendPct < 0 ? 'var(--status-critical)' : 'var(--status-good)'}">${x.trendPct >= 0 ? '+' : ''}${fmtPct(x.trendPct)}</td>
                <td><span class="badge badge-${b.cls}">${b.label}</span></td>
              </tr>
            `; }).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  // ============ Boot ============
  function render() {
    document.getElementById('navCarteira').classList.toggle('active', state.screen === 'carteira');
    document.getElementById('navPerfil').classList.toggle('active', state.screen === 'perfil');
    document.getElementById('navMeta').classList.toggle('active', state.screen === 'meta');
    document.getElementById('navAnalytics').classList.toggle('active', state.screen === 'analytics');
    document.getElementById('navRotina').classList.toggle('active', state.screen === 'rotina');
    document.getElementById('screenCarteira').style.display = state.screen === 'carteira' ? 'block' : 'none';
    document.getElementById('screenPerfil').style.display = state.screen === 'perfil' ? 'block' : 'none';
    document.getElementById('screenMeta').style.display = state.screen === 'meta' ? 'block' : 'none';
    document.getElementById('screenAnalytics').style.display = state.screen === 'analytics' ? 'block' : 'none';
    document.getElementById('screenRotina').style.display = state.screen === 'rotina' ? 'block' : 'none';
    if (state.screen === 'carteira') renderCarteira();
    else if (state.screen === 'perfil') renderPerfil();
    else if (state.screen === 'meta') renderMeta();
    else if (state.screen === 'analytics') renderAnalytics();
    else renderRotina();
    updateMissionBell();
  }

  (function boot() {
    try {
      const savedTheme = localStorage.getItem('dboTheme');
      if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) {}
    if (BOOT_ERROR) {
      document.getElementById('bootErrorSub').textContent = '⚠️ ' + BOOT_ERROR;
    } else {
      document.getElementById('bootErrorSub').textContent = 'Carteira, cronograma e CRM em um só lugar';
    }
    renderAuth();
  })();
</script>
