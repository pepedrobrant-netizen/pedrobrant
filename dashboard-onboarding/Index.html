<!-- Dashboard Onboarding — frontend inteiro num arquivo só (HTML + CSS + JS inline),
     sem build step, como exige rodar dentro do Google Apps Script (HtmlService). -->
<meta charset="utf-8" />
<style>
  /* ---------- Identidade visual Hotmart ---------- */
  :root {
    --c-orange: #FF4000;
    --c-black: #0D0D0D;
    --c-offwhite: #F5F3EF;
    --c-gray: #C3BFB8;
    --c-white: #FFFFFF;
    --c-yellow: #FFD450;
    --c-maroon: #3E0F1D;
    --c-lemon: #6DFF96;
    --c-purple: #B48EFF;
    --c-blue: #44D0FF;

    --bg: var(--c-offwhite);
    --surface: var(--c-white);
    --surface-2: #ECE9E3;
    --text: var(--c-black);
    --text-inverse: var(--c-white);
    --border: var(--c-gray);
    --accent: var(--c-orange);
    --shadow: 0 2px 10px rgba(13,13,13,0.08);
    --radius: 14px;
    --font-display: "Hotmart Display", Georgia, "Times New Roman", serif;
    --font-body: "Hotmart Sans", "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  [data-theme="dark"] {
    --bg: var(--c-black);
    --surface: #1A1A1A;
    --surface-2: #242424;
    --text: var(--c-offwhite);
    --text-inverse: var(--c-black);
    --border: #3A3A3A;
    --shadow: 0 2px 14px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.45;
  }
  h1, h2, h3, .display { font-family: var(--font-display); font-weight: 700; margin: 0; }
  a { color: inherit; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--c-gray); border-radius: 8px; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ---------- Tela cheia (login / seleção de perfil) ---------- */
  .fullscreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background:
      radial-gradient(1200px 600px at 20% -10%, rgba(255,64,0,0.10), transparent),
      var(--bg);
  }
  .brand-mark { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 28px; }
  .brand-dot { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); }
  .tagline { color: var(--c-gray); font-size: 12px; text-align: center; margin-top: 6px; letter-spacing: .02em; }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 32px; width: 100%; max-width: 380px;
  }
  .panel h1 { font-size: 22px; margin-bottom: 6px; }
  .panel p.sub { color: var(--c-gray); margin: 0 0 20px; font-size: 13px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 18px; border-radius: 10px; border: 1px solid transparent;
    background: var(--accent); color: #fff; font-weight: 700; transition: filter .15s, transform .05s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(0.98); }
  .btn.block { width: 100%; }
  .btn.ghost { background: transparent; border-color: var(--border); color: var(--text); }
  .btn.small { padding: 6px 12px; font-size: 12px; }
  .btn.subtle { background: var(--surface-2); color: var(--text); }
  .error-msg { color: var(--c-orange); font-size: 12px; margin-top: 8px; min-height: 16px; }

  .profiles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; max-width: 640px; width: 100%; }
  .profile-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px 14px; text-align: center; position: relative;
  }
  .profile-card:hover { border-color: var(--accent); }
  .profile-avatar {
    width: 68px; height: 68px; border-radius: 50%; background: var(--surface-2); margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center; font-family: var(--font-display);
    font-size: 24px; color: var(--accent); overflow: hidden; border: 2px solid var(--border);
  }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-name { font-weight: 700; }
  .profile-role { color: var(--c-gray); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .profile-pick { width: 100%; margin-top: 12px; }
  .profile-photo-edit {
    position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--border); font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- Shell principal ---------- */
  .topbar {
    display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
  }
  .topbar .brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; }
  .nav-tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
  .nav-tab {
    padding: 8px 14px; border-radius: 10px; background: transparent; border: 1px solid transparent;
    font-weight: 600; color: var(--text); white-space: nowrap;
  }
  .nav-tab.active { background: var(--accent); color: #fff; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .icon-btn .dot {
    position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
  }
  .chip {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 5px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border); position: relative;
  }
  .chip img, .chip .ph { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .menu-pop {
    position: absolute; top: 44px; right: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow); min-width: 200px; padding: 6px; z-index: 30;
  }
  .menu-pop button { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; background: transparent; border: none; }
  .menu-pop button:hover { background: var(--surface-2); }

  main.screen { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; width: 100%; }
  .boot-error {
    background: var(--c-maroon); color: #fff; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px;
  }

  /* ---------- Componentes gerais ---------- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
    box-shadow: var(--shadow);
  }
  .kpi-card .label { font-size: 12px; color: var(--c-gray); margin-bottom: 4px; }
  .kpi-card .value { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
  .kpi-card.clickable { cursor: pointer; }
  .kpi-card.clickable:hover { border-color: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .card + .card { margin-top: 16px; }
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar input[type=text], .toolbar select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .multi-select { position: relative; }
  .multi-select-btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .multi-select-pop {
    position: absolute; top: 38px; left: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow); padding: 8px; z-index: 25; min-width: 220px; max-height: 260px; overflow: auto;
  }
  .multi-select-pop label { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: 13px; }
  .multi-select-pop label:hover { background: var(--surface-2); }
  .toggle-switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
  .toggle-switch input { width: 34px; height: 18px; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th, table.data-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; text-align: left; }
  table.data-table th { color: var(--c-gray); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; cursor: pointer; user-select: none; }
  table.data-table th.sorted::after { content: " ▾"; }
  table.data-table tbody tr:hover { background: var(--surface-2); cursor: pointer; }
  .table-scroll { overflow-x: auto; }
  .cols-btn { position: relative; }

  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.orange { background: rgba(255,64,0,0.12); color: var(--c-orange); }
  .badge.lemon { background: rgba(109,255,150,0.18); color: #1f7a3f; }
  .badge.blue { background: rgba(68,208,255,0.18); color: #0b6d8c; }
  .badge.purple { background: rgba(180,142,255,0.18); color: #5d3fae; }
  .badge.gray { background: var(--surface-2); color: var(--text); }
  .badge.maroon { background: rgba(62,15,29,0.14); color: var(--c-maroon); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--c-gray); }

  /* ---------- Perfil do cliente ---------- */
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .client-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .client-card:hover { border-color: var(--accent); cursor: pointer; }
  .client-card .avatar {
    width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 700; margin-bottom: 10px;
  }
  .progress-bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
  .progress-bar > div { height: 100%; background: var(--accent); }

  .detail-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .detail-header .avatar-lg {
    width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 20px; flex-shrink: 0;
  }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab-btn { padding: 9px 16px; border-radius: 10px 10px 0 0; background: transparent; border: none; font-weight: 700; color: var(--c-gray); }
  .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

  .phase-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--border); }
  .phase-num { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .phase-num.done { background: var(--c-lemon); color: #08340f; }
  .phase-num.current { background: var(--accent); color: #fff; }

  .crm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; }
  .crm-field label { font-size: 11px; color: var(--c-gray); display:block; margin-bottom: 4px; }
  .crm-field textarea, .crm-field input[type=text] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .crm-checkbox { display: flex; align-items: center; gap: 8px; }

  .photos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 10px; margin-top: 10px; }
  .photo-thumb { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); aspect-ratio: 1; }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-thumb .cap { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(13,13,13,0.6); color: #fff; font-size: 10px; padding: 4px 6px; }
  .lightbox { position: fixed; inset: 0; background: rgba(13,13,13,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; flex-direction: column; gap: 12px; }
  .lightbox img { max-width: 90vw; max-height: 75vh; border-radius: 10px; }

  /* ---------- Meta ---------- */
  .hero-meta { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .ring-wrap { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
  .ring-wrap .ring-value { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .ring-value .pct { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
  .level-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; margin-top: 8px; }
  .level-bronze { background: rgba(180,120,60,0.18); color: #8a5a2b; }
  .level-prata { background: rgba(160,160,170,0.2); color: #5a5a63; }
  .level-ouro { background: rgba(255,212,80,0.28); color: #8a6a00; }
  .level-diamante { background: rgba(68,208,255,0.2); color: #0b6d8c; }

  .chart-wrap { width: 100%; overflow-x: auto; }
  .chart-legend { display: flex; gap: 14px; font-size: 12px; margin-bottom: 6px; }
  .chart-legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; }

  .ranking-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .ranking-pos { width: 22px; text-align: center; font-weight: 700; color: var(--c-gray); }

  /* ---------- Rotina ---------- */
  .subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .subtab-btn { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 12px; }
  .subtab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .checklist-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .mission-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .mission-points { font-family: var(--font-display); font-weight: 700; color: var(--accent); }

  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--c-black); color: #fff; padding: 12px 18px;
    border-radius: 10px; box-shadow: var(--shadow); z-index: 200; font-size: 13px;
  }
  [data-theme="dark"] .toast { background: var(--c-white); color: var(--c-black); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(13,13,13,0.55); display: flex; align-items: center; justify-content: center; z-index: 90; padding: 20px; }
  .modal { background: var(--surface); border-radius: var(--radius); padding: 22px; width: 100%; max-width: 480px; box-shadow: var(--shadow); max-height: 85vh; overflow: auto; }

  @media (max-width: 720px) {
    .profiles-grid { grid-template-columns: repeat(2, 1fr); }
    .nav-tabs { order: 3; width: 100%; }
    .topbar { flex-wrap: wrap; }
  }
</style>

<div id="app"></div>

<script>
  // ---------- Dados injetados pelo servidor (Código.gs / doGet) ----------
  // NÃO reabrir esse mapeamento de campos: já foi validado contra a planilha real.
  var PORTFOLIO_DATA = {
    madu: <?!= maduJson ?>,
    pedro: <?!= pedroJson ?>,
    josiane: <?!= josianeJson ?>,
    ilana: <?!= ilanaJson ?>
  };
  var OVERLAY_DATA = <?!= overlayJson ?>;
  var MISSOES_DATA = <?!= missoesJson ?>;
  var BOOT_ERROR = <?!= JSON.stringify(bootError) ?>;
</script>
<script>
  // ================= Helpers gerais =================
  var PESSOAS = {
    Madu: { role: "Onboarder" }, Pedro: { role: "Onboarder" },
    Josiane: { role: "Onboarder" }, Ilana: { role: "Onboarder" },
    Amanda: { role: "Administrador" }, Julia: { role: "Administrador" }
  };
  var ADMIN_NOMES = ["Amanda", "Julia"];
  var STATUS_JORNADA_ATIVA = ["Pre Onboarding", "Welcome", "Product Migration", "Ready for Activation", "Activation & Monitoring"];
  var STATUS_TODOS = STATUS_JORNADA_ATIVA.concat(["Accomplished", "Unaccomplished"]);

  var FIELD_DEFS = [
    { key: "hotmartId", label: "Hotmart ID", fixed: true },
    { key: "nome", label: "Nome", fixed: true },
    { key: "status", label: "Status", type: "status" },
    { key: "closer", label: "Closer" },
    { key: "gmv", label: "GMV", type: "brl" },
    { key: "cw", label: "CW", type: "date" },
    { key: "daysCarteira", label: "Days carteira", type: "num" },
    { key: "pctAtingido", label: "% atingido", type: "pct" },
    { key: "vds", label: "VDs", type: "num" },
    { key: "ativacao", label: "Ativação", type: "date" },
    { key: "sdr", label: "SDR" },
    { key: "sow", label: "SOW" },
    { key: "amount3Meses", label: "Amount 3 meses", type: "brl" },
    { key: "taxaAtual", label: "Taxa atual", type: "pct-raw" },
    { key: "periodo", label: "Período" },
    { key: "platAnterior", label: "Plat. anterior" },
    { key: "uf", label: "UF" },
    { key: "op", label: "OP", type: "date" },
    { key: "segmento", label: "Segmento" },
    { key: "amount12Meses", label: "Amount 12 meses", type: "brl" },
    { key: "amountReal", label: "Amount esperado hoje", type: "brl" },
    { key: "pctAmount", label: "Tracking GMV atual", type: "pct" },
    { key: "diasAtivado", label: "Dias ativado", type: "num" },
    { key: "observacoes", label: "Observações" },
    { key: "lancamento", label: "Lançamento" },
    { key: "_cronogramaProgress", label: "Progresso do cronograma", type: "pct-raw" },
    { key: "_ultimoContatoDias", label: "Último contato (dias)", type: "num" },
    { key: "_ultimoContatoData", label: "Último contato (data)", type: "date" }
  ];
  var DEFAULT_VISIBLE_COLS = ["status", "closer", "gmv", "cw", "daysCarteira", "pctAtingido", "vds"];

  function fmtBRL(v) {
    if (v === null || typeof v === "undefined" || isNaN(v)) return "—";
    return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
  }
  function fmtPct(v) {
    if (v === null || typeof v === "undefined" || isNaN(v)) return "—";
    return (v * 100).toLocaleString("pt-BR", { maximumFractionDigits: 0 }) + "%";
  }
  function fmtPctRaw(v) {
    if (v === null || typeof v === "undefined" || isNaN(v)) return "—";
    return v + "%";
  }
  function fmtDate(v) {
    if (!v) return "—";
    var parts = String(v).split("-");
    if (parts.length !== 3) return v;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }
  function fmtNum(v) { return (v === null || typeof v === "undefined") ? "—" : v; }
  function fmtCell(field, value) {
    if (value === null || typeof value === "undefined" || value === "") return "—";
    switch (field.type) {
      case "brl": return fmtBRL(value);
      case "pct": return fmtPct(value);
      case "pct-raw": return fmtPctRaw(value);
      case "date": return fmtDate(value);
      case "num": return fmtNum(value);
      case "status": return statusBadge(value);
      default: return escapeHtml(String(value));
    }
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function initials(nome) {
    if (!nome) return "?";
    var parts = String(nome).trim().split(/\s+/);
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }
  function statusBadgeClass(status) {
    var map = {
      "Pre Onboarding": "gray", "Welcome": "blue", "Product Migration": "purple",
      "Ready for Activation": "yellow", "Activation & Monitoring": "orange",
      "Accomplished": "lemon", "Unaccomplished": "maroon"
    };
    return map[status] || "gray";
  }
  function statusBadge(status) {
    if (!status) return "—";
    var cls = statusBadgeClass(status);
    if (cls === "yellow") cls = "orange"; // sem classe .badge.yellow definida — reaproveita a paleta existente
    return '<span class="badge ' + cls + '">' + escapeHtml(status) + '</span>';
  }
  function daysSince(dateStr) {
    if (!dateStr) return null;
    var d = new Date(dateStr + "T00:00:00");
    if (isNaN(d.getTime())) return null;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }
  function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

  function toast(msg) {
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 3200);
  }

  function withGsRun(successCb, failureCb) {
    // Wrapper fino sobre google.script.run — quando aberto fora do Apps Script (ex.:
    // prévia local no navegador), google.script.run não existe; nesse caso a própria
    // prévia substitui esta função por uma versão mock (ver preview.html).
    if (typeof google === "undefined" || !google.script || !google.script.run) {
      (failureCb || function () {})({ message: "google.script.run indisponível neste ambiente." });
      return null;
    }
    return google.script.run.withSuccessHandler(successCb).withFailureHandler(failureCb || function (err) {
      toast("Erro: " + (err && err.message ? err.message : err));
    });
  }

  // ================= Estado =================
  var state = {
    theme: localStorage.getItem("dboTheme") || "light",
    stage: "login", // login -> profile -> app
    session: null, // { token }
    perfil: null, // nome escolhido ("Ilana", "Amanda", ...)
    screen: "carteira",
    ownerView: null, // p/ admin: null = "Todos", ou um nome específico
    overlay: OVERLAY_DATA || {},
    missoes: MISSOES_DATA || [],
    carteira: {
      statusFiltro: STATUS_JORNADA_ATIVA.slice(),
      closerFiltro: [],
      marco: "",
      busca: "",
      soAlerta: false,
      colunasVisiveis: DEFAULT_VISIBLE_COLS.slice(),
      sortKey: "cw",
      sortDir: "desc"
    },

    clienteAba: "cronograma",

  function applyTheme() {

  function toggleTheme() {
    state.theme = state.theme === "dark" ? "light" : "dark";

  function isAdmin() { return ADMIN_NOMES.indexOf(state.perfil) !== -1; }

  // Lista de clientes "efetiva" pro perfil atual: um onboarder só vê a própria
  // carteira; admin vê a carteira escolhida no seletor, ou a união das 4 (consolidado).
  function clientesDoPerfil() {
    if (!isAdmin()) return PORTFOLIO_DATA[state.perfil.toLowerCase()] || [];
    if (state.ownerView) return PORTFOLIO_DATA[state.ownerView.toLowerCase()] || [];
    var todos = [];
    ["madu", "pedro", "josiane", "ilana"].forEach(function (k) {
      todos = todos.concat(PORTFOLIO_DATA[k] || []);
    });
    return todos;
  }

  function clientePorId(hotmartId) {
    var todos = [];
    ["madu", "pedro", "josiane", "ilana"].forEach(function (k) { todos = todos.concat(PORTFOLIO_DATA[k] || []); });
    return todos.filter(function (c) { return c.hotmartId === hotmartId; })[0] || null;
  }

  // ================= Montagem / roteador =================
  function render() {
    var root = document.getElementById("app");
    if (state.stage === "login") { root.innerHTML = renderLogin(); bindLogin(); return; }
    if (state.stage === "profile") { root.innerHTML = renderProfileSelect(); bindProfileSelect(); return; }
    root.innerHTML = renderShell();

  // ================= Login =================
  function renderLogin() {
    return '' +
      '<div class="fullscreen"><div>' +
        '<div class="brand-mark"><span class="brand-dot"></span><h1 class="display" style="font-size:22px;">Dashboard Onboarding</h1></div>' +
        '<div class="panel">' +
          '<h1>Login do time</h1>' +
          '<p class="sub">Senha compartilhada da equipe de onboarding.</p>' +
          '<form id="loginForm">' +
            '<div class="field"><label>Senha</label><input type="password" id="loginPassword" autofocus /></div>' +

            '<div class="error-msg" id="loginError"></div>' +
          '</form>' +
        '</div>' +
        '<div class="tagline">Hotmart. Aqui acontece.</div>' +
      '</div></div>';

  function bindLogin() {
    var form = document.getElementById("loginForm");
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var pass = document.getElementById("loginPassword").value;

      withGsRun(function (result) {

        errEl.textContent = (err && err.message) || "Não foi possível entrar.";
      }).login(pass);
    });

  // ================= Seleção de perfil =================
  function loadProfilePhoto(nome) {
    return localStorage.getItem("dboFoto_" + nome) || "";
  }
  function saveProfilePhoto(nome, dataUrl) {
    try { localStorage.setItem("dboFoto_" + nome, dataUrl); } catch (e) { toast("Não foi possível salvar a foto (armazenamento local cheio)."); }
  }
  function renderProfileSelect() {

        '<div class="profile-card" data-nome="' + nome + '">' +

          '</label>' +
          '<input type="file" accept="image/*" id="fotoInput_' + nome + '" class="hidden" data-foto-input="' + nome + '" />' +
          '<div class="profile-name">' + nome + '</div>' +
          '<div class="profile-role">' + PESSOAS[nome].role + '</div>' +

    return '' +
      '<div class="fullscreen"><div style="max-width:680px;">' +

        '<div class="profiles-grid">' + cards + '</div>' +
        '<div class="tagline">Hotmart. Aqui acontece.</div>' +

  function bindProfileSelect() {
    document.querySelectorAll("[data-pick]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.perfil = btn.getAttribute("data-pick");
        state.ownerView = null;
        state.stage = "app";
        render();
      });
    });
    document.querySelectorAll("[data-edit-foto]").forEach(function (btn) {
      btn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var nome = btn.getAttribute("data-edit-foto");
        document.querySelector('[data-foto-input="' + nome + '"]').click();
      });
    });
    document.querySelectorAll("[data-foto-input]").forEach(function (input) {
      input.addEventListener("change", function () {
        var nome = input.getAttribute("data-foto-input");
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();

        reader.readAsDataURL(file);

  // ================= Shell principal (topbar + navegação) =================
  var NAV_ITEMS = [
    { id: "carteira", label: "Carteira" },
    { id: "perfil", label: "Perfil do Cliente" },
    { id: "meta", label: "Meta" },
    { id: "analytics", label: "Analytics" },
    { id: "rotina", label: "Rotina" }
  ];

  function contarAlertas() {
    return clientesDoPerfil().filter(isClienteEmAlerta).length;
  }

  function renderShell() {
    var foto = loadProfilePhoto(state.perfil);
    var nav = NAV_ITEMS.map(function (item) {
      return '<button class="nav-tab' + (state.screen === item.id ? ' active' : '') + '" data-nav="' + item.id + '">' + item.label + '</button>';
    }).join("");
    var alertas = contarAlertas();
    var bootBanner = BOOT_ERROR ? '<div class="boot-error">⚠️ Não foi possível carregar os dados da planilha: ' + escapeHtml(BOOT_ERROR) + '</div>' : "";
    return '' +
      '<div class="topbar">' +
        '<div class="brand"><span class="brand-dot" style="width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block;"></span> Dashboard Onboarding</div>' +
        '<div class="nav-tabs">' + nav + '</div>' +
        '<div class="topbar-right">' +
          '<button class="icon-btn" id="btnTheme" title="Alternar tema">' + (state.theme === "dark" ? "☀️" : "🌙") + '</button>' +
          '<button class="icon-btn" id="btnAlertas" title="Alertas">🔔' + (alertas > 0 ? '<span class="dot"></span>' : '') + '</button>' +
          '<div style="position:relative;">' +
            '<button class="chip" id="btnProfileMenu">' +
              (foto ? '<img src="' + foto + '"/>' : '<span class="ph">' + initials(state.perfil) + '</span>') +
              '<span>' + state.perfil + '</span>' +
            '</button>' +
            '<div id="profileMenuPop" class="menu-pop hidden">' +
              '<button id="btnTrocarPerfil">Trocar perfil</button>' +
              '<button id="btnSair">Sair</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<main class="screen">' + bootBanner + '<div id="screenContent">' + renderScreen() + '</div></main>';
  }

  function bindShell() {
    document.querySelectorAll("[data-nav]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.screen = btn.getAttribute("data-nav");
        if (state.screen !== "perfil") state.clienteSelecionado = null;
        render();
      });
    });
    document.getElementById("btnTheme").addEventListener("click", toggleTheme);
    var menuBtn = document.getElementById("btnProfileMenu");
    var pop = document.getElementById("profileMenuPop");
    menuBtn.addEventListener("click", function (ev) { ev.stopPropagation(); pop.classList.toggle("hidden"); });
    document.addEventListener("click", function () { pop.classList.add("hidden"); }, { once: true });
    document.getElementById("btnTrocarPerfil").addEventListener("click", function () {
      state.stage = "profile"; render();
    });
    document.getElementById("btnSair").addEventListener("click", function () {
      var token = state.session && state.session.token;
      state.session = null; state.perfil = null; state.stage = "login";
      render();
      if (token) withGsRun(function () {}, function () {}).logout(token);
    });
    document.getElementById("btnAlertas").addEventListener("click", function () {
      state.screen = "carteira";
      state.carteira.soAlerta = true;
      render();
    });
    bindScreen();
  }

  function renderScreen() {
    switch (state.screen) {
      case "carteira": return renderCarteira();
      case "perfil": return renderPerfilCliente();
      case "meta": return renderMeta();
      case "analytics": return renderAnalytics();
      case "rotina": return renderRotina();
      default: return "";
    }
  }
  function bindScreen() {
    switch (state.screen) {
      case "carteira": return bindCarteira();
      case "perfil": return bindPerfilCliente();
      case "meta": return bindMeta();
      case "analytics": return bindAnalytics();
      case "rotina": return bindRotina();
    }
  }
  function rerenderScreenContent() {
    document.getElementById("screenContent").innerHTML = renderScreen();
    bindScreen();
  }

  // ================= Carteira =================
  // "Em alerta de prazo": ainda na jornada ativa mas há mais de 90 dias na carteira
  // sem ativar — 90 é o mesmo período usado no cálculo de "Amount 3 meses" /
  // amountReal. Heurística de primeira versão, fácil de trocar por uma regra oficial
  // se o time definir uma (ex.: baseada em SLA por fase).
  function isClienteEmAlerta(c) {
    return STATUS_JORNADA_ATIVA.indexOf(c.status) !== -1 && c.daysCarteira !== null && c.daysCarteira > 90;
  }

  function closersDisponiveis() {
    var set = {};
    ["madu", "pedro", "josiane", "ilana"].forEach(function (k) {
      (PORTFOLIO_DATA[k] || []).forEach(function (c) { if (c.closer) set[c.closer] = true; });
    });
    return Object.keys(set).sort();
  }

  function marcoDoGmv(gmv) {
    if (gmv === null || typeof gmv === "undefined") return "";
    if (gmv >= 1000000) return "1M";
    if (gmv >= 100000) return "100k";
    if (gmv >= 10000) return "10k";
    return "";
  }

  function filtrarOrdenarCarteira() {
    var f = state.carteira;
    var lista = clientesDoPerfil().filter(function (c) {
      if (f.statusFiltro.length && f.statusFiltro.indexOf(c.status) === -1) return false;
      if (f.closerFiltro.length && f.closerFiltro.indexOf(c.closer) === -1) return false;
      if (f.marco && marcoDoGmv(c.gmv) !== f.marco) return false;
      if (f.soAlerta && !isClienteEmAlerta(c)) return false;
      if (f.busca && (c.nome || "").toLowerCase().indexOf(f.busca.toLowerCase()) === -1) return false;
      return true;
    });
    lista.sort(function (a, b) {
      var av = a[f.sortKey], bv = b[f.sortKey];
      if (av === null || typeof av === "undefined") av = "";
      if (bv === null || typeof bv === "undefined") bv = "";
      if (av < bv) return f.sortDir === "asc" ? -1 : 1;
      if (av > bv) return f.sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return lista;
  }

  function historicoMensalPorCW() {
    var todos = clientesDoPerfil();
    var meses = {}; // "yyyy-MM" -> count
    todos.forEach(function (c) {
      if (!c.cw) return;
      var chave = c.cw.slice(0, 7);
      meses[chave] = (meses[chave] || 0) + 1;
    });
    return Object.keys(meses).sort().reverse().slice(0, 12).map(function (k) { return { mes: k, total: meses[k] }; });
  }

  function renderCarteira() {
    var lista = filtrarOrdenarCarteira();
    var todos = clientesDoPerfil();
    var gmvTotal = todos.reduce(function (s, c) { return s + (c.gmv || 0); }, 0);
    var progressoMedio = todos.length ? Math.round(todos.reduce(function (s, c) { return s + (c._cronogramaProgress || 0); }, 0) / todos.length) : 0;
    var emAlerta = todos.filter(isClienteEmAlerta).length;
    var mesAtual = new Date().toISOString().slice(0, 7);
    var novosNoMes = todos.filter(function (c) { return c.cw && c.cw.slice(0, 7) === mesAtual; }).length;

    var seletorConsultor = "";
    if (isAdmin()) {
      var opcoes = ["Madu", "Pedro", "Josiane", "Ilana"].map(function (n) {
        return '<option value="' + n + '"' + (state.ownerView === n ? " selected" : "") + '>' + n + '</option>';
      }).join("");
      seletorConsultor = '<select id="selOwnerView"><option value=""' + (!state.ownerView ? " selected" : "") + '>Todos (consolidado)</option>' + opcoes + '</select>';
    }

    var statusOptions = STATUS_TODOS.map(function (s) {
      var checked = state.carteira.statusFiltro.indexOf(s) !== -1;
      return '<label><input type="checkbox" data-status-opt="' + s + '" ' + (checked ? "checked" : "") + '/> ' + s + '</label>';
    }).join("");
    var closerOptions = closersDisponiveis().map(function (c) {
      var checked = state.carteira.closerFiltro.indexOf(c) !== -1;
      return '<label><input type="checkbox" data-closer-opt="' + escapeHtml(c) + '" ' + (checked ? "checked" : "") + '/> ' + escapeHtml(c) + '</label>';
    }).join("");

    var colOptions = FIELD_DEFS.filter(function (f) { return !f.fixed; }).map(function (f) {
      var checked = state.carteira.colunasVisiveis.indexOf(f.key) !== -1;
      return '<label><input type="checkbox" data-col-opt="' + f.key + '" ' + (checked ? "checked" : "") + '/> ' + f.label + '</label>';
    }).join("");

    var colunasAtivas = FIELD_DEFS.filter(function (f) { return f.fixed || state.carteira.colunasVisiveis.indexOf(f.key) !== -1; });
    var theadCols = colunasAtivas.map(function (f) {
      var sorted = state.carteira.sortKey === f.key;
      return '<th class="' + (sorted ? "sorted" : "") + '" data-sort-key="' + f.key + '">' + f.label + '</th>';
    }).join("");
    var rows = lista.map(function (c) {
      var tds = colunasAtivas.map(function (f) { return '<td>' + fmtCell(f, c[f.key]) + '</td>'; }).join("");
      var alertaTag = isClienteEmAlerta(c) ? ' style="border-left:3px solid var(--c-orange);"' : "";
      return '<tr data-cliente-id="' + c.hotmartId + '"' + alertaTag + '>' + tds + '</tr>';
    }).join("");

    return '' +
      '<div class="kpi-row">' +
        '<div class="kpi-card"><div class="label">Clientes na carteira</div><div class="value">' + todos.length + '</div></div>' +
        '<div class="kpi-card"><div class="label">GMV total</div><div class="value">' + fmtBRL(gmvTotal) + '</div></div>' +
        '<div class="kpi-card"><div class="label">Progresso médio</div><div class="value">' + progressoMedio + '%</div></div>' +
        '<div class="kpi-card"><div class="label">Em alerta de prazo</div><div class="value">' + emAlerta + '</div></div>' +
        '<div class="kpi-card clickable" id="kpiNovosMes"><div class="label">Novos no mês</div><div class="value">' + novosNoMes + '</div></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="toolbar">' +
          (seletorConsultor ? seletorConsultor : "") +
          '<div class="multi-select"><button class="multi-select-btn" data-toggle-pop="statusPop">Status (' + state.carteira.statusFiltro.length + ')</button>' +
            '<div class="multi-select-pop hidden" id="statusPop">' + statusOptions + '</div></div>' +
          '<div class="multi-select"><button class="multi-select-btn" data-toggle-pop="closerPop">Closer (' + (state.carteira.closerFiltro.length || "todos") + ')</button>' +
            '<div class="multi-select-pop hidden" id="closerPop">' + closerOptions + '</div></div>' +
          '<select id="selMarco"><option value="">Todos os marcos</option>' +
            '<option value="10k"' + (state.carteira.marco === "10k" ? " selected" : "") + '>10k</option>' +
            '<option value="100k"' + (state.carteira.marco === "100k" ? " selected" : "") + '>100k</option>' +
            '<option value="1M"' + (state.carteira.marco === "1M" ? " selected" : "") + '>1M</option>' +
          '</select>' +
          '<input type="text" id="buscaNome" placeholder="Buscar por nome..." value="' + escapeHtml(state.carteira.busca) + '"/>' +
          '<label class="toggle-switch"><input type="checkbox" id="chkSoAlerta" ' + (state.carteira.soAlerta ? "checked" : "") + '/> Só em alerta</label>' +
          '<div class="multi-select" style="margin-left:auto;"><button class="multi-select-btn cols-btn" data-toggle-pop="colsPop">⚙ Colunas</button>' +
            '<div class="multi-select-pop hidden" id="colsPop" style="right:0;left:auto;">' + colOptions + '</div></div>' +
        '</div>' +
        '<div class="table-scroll">' +
          '<table class="data-table"><thead><tr>' + theadCols + '</tr></thead><tbody>' +
          (rows || '<tr><td colspan="' + colunasAtivas.length + '"><div class="empty-state">Nenhum cliente encontrado com esses filtros.</div></td></tr>') +
          '</tbody></table>' +
        '</div>' +
      '</div>' +
      (state.kpiHistorico ? renderHistoricoModal() : "");
  }

  function renderHistoricoModal() {
    var hist = historicoMensalPorCW();
    var maxTotal = Math.max.apply(null, hist.map(function (h) { return h.total; }).concat([1]));
    var linhas = hist.map(function (h) {
      var pct = Math.round((h.total / maxTotal) * 100);
      return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">' +
        '<div style="width:70px;font-size:12px;color:var(--c-gray);">' + h.mes + '</div>' +
        '<div style="flex:1;background:var(--surface-2);border-radius:6px;overflow:hidden;height:16px;">' +
          '<div style="width:' + pct + '%;background:var(--accent);height:100%;"></div>' +
        '</div>' +
        '<div style="width:24px;text-align:right;font-weight:700;">' + h.total + '</div>' +
      '</div>';
    }).join("");
    return '<div class="modal-backdrop" id="histBackdrop"><div class="modal">' +
      '<h3 style="margin-bottom:14px;">Novos clientes por mês (CW)</h3>' + linhas +
      '<button class="btn ghost block" id="btnFecharHist" style="margin-top:10px;">Fechar</button>' +
    '</div></div>';
  }

  function bindCarteira() {
    if (isAdmin() && document.getElementById("selOwnerView")) {
      document.getElementById("selOwnerView").addEventListener("change", function () {
        state.ownerView = this.value || null;
        rerenderScreenContent();
      });
    }
    document.querySelectorAll("[data-toggle-pop]").forEach(function (btn) {
      btn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var pop = document.getElementById(btn.getAttribute("data-toggle-pop"));
        var wasHidden = pop.classList.contains("hidden");
        document.querySelectorAll(".multi-select-pop").forEach(function (p) { p.classList.add("hidden"); });
        if (wasHidden) pop.classList.remove("hidden");
      });
    });
    document.addEventListener("click", function () {
      document.querySelectorAll(".multi-select-pop").forEach(function (p) { p.classList.add("hidden"); });
    }, { once: true });
    document.querySelectorAll("[data-status-opt]").forEach(function (chk) {
      chk.addEventListener("change", function () {
        var v = chk.getAttribute("data-status-opt");
        var arr = state.carteira.statusFiltro;
        var i = arr.indexOf(v);
        if (chk.checked && i === -1) arr.push(v);
        if (!chk.checked && i !== -1) arr.splice(i, 1);
        rerenderScreenContent();
      });
    });
    document.querySelectorAll("[data-closer-opt]").forEach(function (chk) {
      chk.addEventListener("change", function () {
        var v = chk.getAttribute("data-closer-opt");
        var arr = state.carteira.closerFiltro;
        var i = arr.indexOf(v);
        if (chk.checked && i === -1) arr.push(v);
        if (!chk.checked && i !== -1) arr.splice(i, 1);
        rerenderScreenContent();
      });
    });
    document.querySelectorAll("[data-col-opt]").forEach(function (chk) {
      chk.addEventListener("change", function () {
        var v = chk.getAttribute("data-col-opt");
        var arr = state.carteira.colunasVisiveis;
        var i = arr.indexOf(v);
        if (chk.checked && i === -1) arr.push(v);
        if (!chk.checked && i !== -1) arr.splice(i, 1);
        rerenderScreenContent();
      });
    });
    var selMarco = document.getElementById("selMarco");
    if (selMarco) selMarco.addEventListener("change", function () { state.carteira.marco = this.value; rerenderScreenContent(); });
    var busca = document.getElementById("buscaNome");
    if (busca) busca.addEventListener("input", function () { state.carteira.busca = this.value; rerenderScreenContent(); });
    var chkAlerta = document.getElementById("chkSoAlerta");
    if (chkAlerta) chkAlerta.addEventListener("change", function () { state.carteira.soAlerta = this.checked; rerenderScreenContent(); });
    document.querySelectorAll("[data-sort-key]").forEach(function (th) {
      th.addEventListener("click", function () {
        var key = th.getAttribute("data-sort-key");
        if (state.carteira.sortKey === key) {
          state.carteira.sortDir = state.carteira.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.carteira.sortKey = key; state.carteira.sortDir = "desc";
        }
        rerenderScreenContent();
      });
    });

  function resizeImageFile(file, maxDim, quality, cb) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ================= Gráficos SVG (sem dependência externa) =================
  function ultimosMeses(qtd) {
    var out = [];
    var d = new Date();
    d.setDate(1);
    for (var i = 0; i < qtd; i++) {
      out.unshift(d.toISOString().slice(0, 7));
      d.setMonth(d.getMonth() - 1);
    }
    return out;
  }
  function mesLabel(chaveAno) {
    var meses = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
    var partes = chaveAno.split("-");
    return meses[Number(partes[1]) - 1] + "/" + partes[0].slice(2);
  }

  function svgLineChart(series, meses, opts) {
    var w = (opts && opts.width) || 640, h = (opts && opts.height) || 220, pad = 34;
    var maxVal = Math.max.apply(null, [1].concat(series.reduce(function (acc, s) { return acc.concat(s.points); }, [])));
    var stepX = (w - pad * 2) / Math.max(1, meses.length - 1);
    function coordFor(i, v) {
      var x = pad + i * stepX;
      var y = h - pad - (v / maxVal) * (h - pad * 2);
      return [x, y];
    }
    var gridY = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      var y = h - pad - f * (h - pad * 2);
      return '<line x1="' + pad + '" y1="' + y + '" x2="' + (w - pad) + '" y2="' + y + '" stroke="var(--border)" stroke-width="1"/>';
    }).join("");
    var xLabels = meses.map(function (m, i) {
      var x = pad + i * stepX;
      return '<text x="' + x + '" y="' + (h - 8) + '" font-size="10" fill="var(--c-gray)" text-anchor="middle">' + mesLabel(m) + '</text>';
    }).join("");
    var linhas = series.map(function (s) {
      var pts = s.points.map(function (v, i) { return coordFor(i, v); });
      var d = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
      var dashAttr = s.dash ? ' stroke-dasharray="5,4"' : "";
      var circles = pts.map(function (p) { return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + s.color + '"/>'; }).join("");
      return '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.5"' + dashAttr + '/>' + circles;
    }).join("");
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;max-width:' + w + 'px;height:' + h + 'px;">' + gridY + linhas + xLabels + '</svg>';
  }

  function progressRingSvg(pct, size) {
    size = size || 150;
    var r = size / 2 - 12, c = size / 2, circ = 2 * Math.PI * r;
    var clamped = Math.max(0, Math.min(100, pct));
    var dash = (clamped / 100) * circ;
    return '<svg viewBox="0 0 ' + size + ' ' + size + '" style="width:' + size + 'px;height:' + size + 'px;transform:rotate(-90deg);">' +
      '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="12"/>' +
      '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="var(--c-orange)" stroke-width="12" ' +
        'stroke-dasharray="' + dash.toFixed(1) + ' ' + circ.toFixed(1) + '" stroke-linecap="round"/>' +
    '</svg>';
  }

  // ================= Meta =================
  function nivelGamificado(pct) {
    if (pct >= 100) return { nome: "Diamante", cls: "level-diamante" };
    if (pct >= 80) return { nome: "Ouro", cls: "level-ouro" };
    if (pct >= 50) return { nome: "Prata", cls: "level-prata" };
    return { nome: "Bronze", cls: "level-bronze" };
  }

  function renderMeta() {
    var meses = ultimosMeses(8);
    if (!state.meta) state.meta = { periodo: meses[meses.length - 1] };
    var periodo = state.meta.periodo;
    var todos = clientesDoPerfil();

    var doPeriodo = todos.filter(function (c) { return c.cw && c.cw.slice(0, 7) === periodo; });
    var ativadosNoPeriodo = todos.filter(function (c) { return c.ativacao && c.ativacao.slice(0, 7) === periodo; });
    var gmvPeriodo = doPeriodo.reduce(function (s, c) { return s + (c.gmv || 0); }, 0);
    var metaPeriodo = doPeriodo.reduce(function (s, c) { return s + (c.amount3Meses || 0); }, 0);
    var pctHero = metaPeriodo ? Math.round((gmvPeriodo / metaPeriodo) * 100) : 0;
    var nivel = nivelGamificado(pctHero);

    var pctFerramentas = todos.length ? Math.round(todos.reduce(function (s, c) { return s + (simpleHashClient_(c.hotmartId) % 101); }, 0) / todos.length) : 0;
    var bonusIlustrativo = Math.round((gmvPeriodo * 0.004) / 50) * 50;

    var opcoesMes = meses.map(function (m) { return '<option value="' + m + '"' + (m === periodo ? " selected" : "") + '>' + mesLabel(m) + "/" + m.slice(0, 4) + '</option>'; }).join("");

    var gmvAcumulado = [], metaAcumulado = [], ativAcumulado = [], fechadosAcumulado = [];
    var accGmv = 0, accMeta = 0, accAtiv = 0, accFechados = 0;
    meses.forEach(function (m) {
      var doMes = todos.filter(function (c) { return c.cw && c.cw.slice(0, 7) === m; });
      accGmv += doMes.reduce(function (s, c) { return s + (c.gmv || 0); }, 0);
      accMeta += doMes.reduce(function (s, c) { return s + (c.amount3Meses || 0); }, 0);
      accFechados += doMes.length;
      accAtiv += todos.filter(function (c) { return c.ativacao && c.ativacao.slice(0, 7) === m; }).length;
      gmvAcumulado.push(accGmv); metaAcumulado.push(accMeta);
      ativAcumulado.push(accAtiv); fechadosAcumulado.push(accFechados);
    });

    var praAtivar = todos.filter(function (c) { return STATUS_JORNADA_ATIVA.indexOf(c.status) !== -1 && !c.ativacao; })
      .sort(function (a, b) { return (b.daysCarteira || 0) - (a.daysCarteira || 0); }).slice(0, 15);

    var ranking = "";
    if (isAdmin()) {
      var linhas = ["Madu", "Pedro", "Josiane", "Ilana"].map(function (nome) {
        var carteira = PORTFOLIO_DATA[nome.toLowerCase()] || [];
        var ativ = carteira.filter(function (c) { return c.ativacao && c.ativacao.slice(0, 7) === periodo; }).length;
        var gmv = carteira.filter(function (c) { return c.cw && c.cw.slice(0, 7) === periodo; }).reduce(function (s, c) { return s + (c.gmv || 0); }, 0);
        return { nome: nome, ativ: ativ, gmv: gmv };
      }).sort(function (a, b) { return b.gmv - a.gmv; });
      ranking = '<div class="card"><div class="section-title">Ranking da equipe — ' + mesLabel(periodo) + '</div>' +
        linhas.map(function (l, i) {
          return '<div class="ranking-row"><div class="ranking-pos">' + (i + 1) + '</div>' +
            '<div style="flex:1;font-weight:700;">' + l.nome + '</div>' +
            '<div>' + l.ativ + ' ativações</div><div style="width:120px;text-align:right;">' + fmtBRL(l.gmv) + '</div></div>';
        }).join("") + '</div>';
    }

    return '' +
      '<div class="toolbar"><label style="font-weight:700;">Período:</label><select id="selPeriodoMeta">' + opcoesMes + '</select></div>' +
      '<div class="card"><div class="hero-meta">' +
        '<div class="ring-wrap">' + progressRingSvg(pctHero) + '<div class="ring-value"><span class="pct">' + pctHero + '%</span><span class="level-pill ' + nivel.cls + '">' + nivel.nome + '</span></div></div>' +
        '<div style="flex:1;min-width:220px;">' +
          '<div class="section-title">Atingimento do período (GMV / meta)</div>' +
          '<div style="color:var(--c-gray);font-size:13px;">GMV real: <b style="color:var(--text);">' + fmtBRL(gmvPeriodo) + '</b> · Meta (Amount 3 meses): <b style="color:var(--text);">' + fmtBRL(metaPeriodo) + '</b></div>' +
        '</div>' +
      '</div></div>' +
      '<div class="kpi-row">' +
        '<div class="kpi-card"><div class="label">Ativação real (período)</div><div class="value">' + ativadosNoPeriodo.length + '</div></div>' +
        '<div class="kpi-card"><div class="label">% Ferramentas (ilustrativo)</div><div class="value">' + pctFerramentas + '%</div></div>' +
        '<div class="kpi-card"><div class="label">Receita/GMV real (período)</div><div class="value">' + fmtBRL(gmvPeriodo) + '</div></div>' +
        '<div class="kpi-card"><div class="label">Bônus (ilustrativo)</div><div class="value">' + fmtBRL(bonusIlustrativo) + '</div></div>' +
      '</div>' +
      '<div class="card"><div class="section-title">GMV acumulado × Meta</div>' +
        '<div class="chart-legend"><span><span class="dot" style="background:var(--c-orange);"></span>GMV real</span><span><span class="dot" style="background:var(--c-gray);"></span>Meta (Amount 3 meses)</span></div>' +
        '<div class="chart-wrap">' + svgLineChart([
          { color: "#FF4000", points: gmvAcumulado },
          { color: "#C3BFB8", dash: true, points: metaAcumulado }
        ], meses) + '</div></div>' +
      '<div class="card"><div class="section-title">Ativações acumuladas × Clientes fechados (proxy de meta)</div>' +
        '<div class="chart-legend"><span><span class="dot" style="background:var(--c-blue);"></span>Ativações reais</span><span><span class="dot" style="background:var(--c-gray);"></span>Fechados (CW)</span></div>' +
        '<div class="chart-wrap">' + svgLineChart([
          { color: "#44D0FF", points: ativAcumulado },
          { color: "#C3BFB8", dash: true, points: fechadosAcumulado }
        ], meses) + '</div></div>' +
      '<div class="card"><div class="section-title">Clientes ativados no período</div>' + tabelaSimples(ativadosNoPeriodo, ["nome", "closer", "ativacao", "gmv"]) + '</div>' +
      '<div class="card"><div class="section-title">Clientes pra ativar (mais antigos primeiro)</div>' + tabelaSimples(praAtivar, ["nome", "closer", "status", "daysCarteira"]) + '</div>' +
      ranking;
  }

  function simpleHashClient_(str) {
    var hash = 5381, s = String(str || "");
    for (var i = 0; i < s.length; i++) hash = ((hash << 5) + hash + s.charCodeAt(i)) & 0xffffffff;
    return Math.abs(hash);
  }

  function tabelaSimples(lista, keys) {
    if (!lista.length) return '<div class="empty-state">Nenhum cliente aqui.</div>';
    var defsByKey = {}; FIELD_DEFS.forEach(function (f) { defsByKey[f.key] = f; });
    var head = keys.map(function (k) { return '<th>' + (defsByKey[k] ? defsByKey[k].label : k) + '</th>'; }).join("");
    var rows = lista.map(function (c) {
      var tds = keys.map(function (k) { return '<td>' + fmtCell(defsByKey[k] || {}, c[k]) + '</td>'; }).join("");
      return '<tr data-cliente-id="' + c.hotmartId + '">' + tds + '</tr>';
    }).join("");
    return '<div class="table-scroll"><table class="data-table"><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function bindMeta() {
    var sel = document.getElementById("selPeriodoMeta");
    if (sel) sel.addEventListener("change", function () { state.meta.periodo = this.value; rerenderScreenContent(); });
    document.querySelectorAll("[data-cliente-id]").forEach(function (tr) {
      tr.addEventListener("click", function () {
        state.clienteSelecionado = tr.getAttribute("data-cliente-id");
        state.clienteAba = "cronograma"; state.screen = "perfil"; render();
      });
    });
  }

  // ================= Analytics =================
  // Protótipo visual — os números de "queda" aqui são ilustrativos (hash determinístico
  // do Hotmart ID), até existir integração real com o Astrobox interno. O recorte é
  // sempre a jornada ativa (5 status), sem toggle pra ver histórico encerrado.
  function quedaDoCliente(c) {
    return simpleHashClient_(c.hotmartId + "|queda") % 60; // 0 a 59
  }
  function statusQueda(pct) {
    if (pct >= 40) return { label: "Crítico", cls: "maroon" };
    if (pct >= 20) return { label: "Atenção", cls: "orange" };
    return { label: "Estável", cls: "lemon" };
  }

  function renderAnalytics() {
    var ativos = clientesDoPerfil().filter(function (c) { return STATUS_JORNADA_ATIVA.indexOf(c.status) !== -1; });
    var comQueda = ativos.map(function (c) { return { c: c, queda: quedaDoCliente(c) }; });
    var emQueda = comQueda.filter(function (x) { return x.queda >= 20; });
    var quedaMedia = ativos.length ? Math.round(comQueda.reduce(function (s, x) { return s + x.queda; }, 0) / ativos.length) : 0;
    var maior = comQueda.slice().sort(function (a, b) { return b.queda - a.queda; })[0];

    var meses = ultimosMeses(8);
    var tendencia = meses.map(function (m) { return 25 + (simpleHashClient_(m + "|tendencia") % 45); });

    var maioresQuedas = comQueda.slice().sort(function (a, b) { return b.queda - a.queda; }).slice(0, 15);
    var rows = maioresQuedas.map(function (x) {
      var st = statusQueda(x.queda);
      return '<tr data-cliente-id="' + x.c.hotmartId + '">' +
        '<td>' + escapeHtml(x.c.nome || "—") + '</td>' +
        '<td>' + escapeHtml(x.c.closer || "—") + '</td>' +
        '<td>' + statusBadge(x.c.status) + '</td>' +
        '<td>' + x.queda + '%</td>' +
        '<td><span class="badge ' + st.cls + '">' + st.label + '</span></td>' +
      '</tr>';
    }).join("");

    return '' +
      '<p style="font-size:12px;color:var(--c-gray);margin-bottom:14px;">Recorte fixo na jornada ativa · dados ilustrativos até existir integração com o Astrobox interno.</p>' +
      '<div class="kpi-row">' +
        '<div class="kpi-card"><div class="label">Clientes em queda</div><div class="value">' + emQueda.length + '</div></div>' +
        '<div class="kpi-card"><div class="label">Queda média</div><div class="value">' + quedaMedia + '%</div></div>' +
        '<div class="kpi-card"><div class="label">Maior queda</div><div class="value">' + (maior ? maior.queda + '%' : "—") + '</div><div style="font-size:12px;color:var(--c-gray);">' + (maior ? escapeHtml(maior.c.nome || "") : "") + '</div></div>' +
      '</div>' +
      '<div class="card"><div class="section-title">Tendência de queda (ilustrativo)</div>' +
        '<div class="chart-wrap">' + svgLineChart([{ color: "#FF4000", points: tendencia }], meses) + '</div></div>' +
      '<div class="card"><div class="section-title">Maiores quedas</div>' +
        '<div class="table-scroll"><table class="data-table"><thead><tr><th>Nome</th><th>Closer</th><th>Status</th><th>Queda</th><th>Alerta</th></tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="5"><div class="empty-state">Sem clientes na jornada ativa.</div></td></tr>') + '</tbody></table></div>' +
      '</div>';
  }

  function bindAnalytics() {
    document.querySelectorAll("[data-cliente-id]").forEach(function (tr) {
      tr.addEventListener("click", function () {
        state.clienteSelecionado = tr.getAttribute("data-cliente-id");
        state.clienteAba = "cronograma"; state.screen = "perfil"; render();
      });
    });
  }

  // ================= Rotina =================
  var ROTINA_SUBABAS = [
    { id: "semana", label: "Semana" }, { id: "diario", label: "Diário" },
    { id: "checklist", label: "Checklist semanal" }, { id: "tipo", label: "Por tipo de cliente" },
    { id: "mensal", label: "Mensal" }, { id: "missoes", label: "Missões" }
  ];
  var CHECKLIST_SEMANAL_ITENS = [
    "Revisar carteira e status de cada cliente", "Atualizar CRM dos clientes tocados na semana",
    "Checar clientes em alerta de prazo", "Enviar relatório semanal pra coordenação",
    "Planejar contatos da próxima semana"
  ];
  var DIAS_SEMANA = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta"];

  function chaveSemanaAtual() {
    var d = new Date();
    var onejan = new Date(d.getFullYear(), 0, 1);
    var semana = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
    return d.getFullYear() + "-W" + semana;
  }

  function renderRotina() {
    if (!state.rotinaSubaba) state.rotinaSubaba = "semana";
    var tabs = ROTINA_SUBABAS.map(function (t) {
      return '<button class="subtab-btn' + (state.rotinaSubaba === t.id ? " active" : "") + '" data-subtab="' + t.id + '">' + t.label + '</button>';
    }).join("");
    var conteudo;
    switch (state.rotinaSubaba) {
      case "semana": conteudo = renderRotinaSemana(); break;
      case "diario": conteudo = renderRotinaDiario(); break;
      case "checklist": conteudo = renderRotinaChecklist(); break;
      case "tipo": conteudo = renderRotinaPorTipo(); break;
      case "mensal": conteudo = renderRotinaMensal(); break;
      case "missoes": conteudo = renderRotinaMissoes(); break;
    }
    return '<div class="subtabs">' + tabs + '</div>' + conteudo;
  }

  function renderRotinaSemana() {
    var todos = clientesDoPerfil().filter(function (c) { return STATUS_JORNADA_ATIVA.indexOf(c.status) !== -1; });
    var colunas = DIAS_SEMANA.map(function (dia, i) {
      var doDia = todos.filter(function (c) { return simpleHashClient_(c.hotmartId) % 5 === i; });
      var itens = doDia.map(function (c) { return '<div class="checklist-item" data-cliente-id="' + c.hotmartId + '" style="cursor:pointer;">' + escapeHtml(c.nome || "—") + '</div>'; }).join("");
      return '<div class="card" style="flex:1;min-width:180px;"><div class="section-title">' + dia + '</div>' + (itens || '<div class="empty-state">Sem contatos.</div>') + '</div>';
    }).join("");
    return '<div style="display:flex;gap:12px;flex-wrap:wrap;">' + colunas + '</div>';
  }

  function renderRotinaDiario() {
    var todos = clientesDoPerfil().filter(function (c) { return STATUS_JORNADA_ATIVA.indexOf(c.status) !== -1; });
    var contatarHoje = todos.filter(function (c) { return (c._ultimoContatoDias || 0) >= 25; })
      .sort(function (a, b) { return (b._ultimoContatoDias || 0) - (a._ultimoContatoDias || 0); });
    var rows = contatarHoje.map(function (c) {
      return '<div class="checklist-item" data-cliente-id="' + c.hotmartId + '" style="cursor:pointer;">' +
        '<span style="flex:1;">' + escapeHtml(c.nome || "—") + '</span>' +
        '<span style="font-size:12px;color:var(--c-gray);">Último contato há ' + c._ultimoContatoDias + ' dias</span>' +
      '</div>';
    }).join("");
    return '<div class="card"><div class="section-title">Contatar hoje</div>' + (rows || '<div class="empty-state">Ninguém pendente de contato hoje.</div>') + '</div>';
  }

  function renderRotinaChecklist() {
    var semana = chaveSemanaAtual();
    var salvo = {};
    try { salvo = JSON.parse(localStorage.getItem("dboChecklist_" + state.perfil + "_" + semana) || "{}"); } catch (e) {}
    var itens = CHECKLIST_SEMANAL_ITENS.map(function (item, i) {
      return '<div class="checklist-item"><input type="checkbox" data-checklist-idx="' + i + '" ' + (salvo[i] ? "checked" : "") + '/> <span style="' + (salvo[i] ? "text-decoration:line-through;color:var(--c-gray);" : "") + '">' + item + '</span></div>';
    }).join("");
    return '<div class="card"><div class="section-title">Checklist da semana (' + semana + ')</div>' + itens + '</div>';
  }

  function renderRotinaPorTipo() {
    var todos = clientesDoPerfil();
    var porSegmento = {};
    todos.forEach(function (c) {
      var seg = c.segmento || "Sem segmento";
      if (!porSegmento[seg]) porSegmento[seg] = { count: 0, gmv: 0 };
      porSegmento[seg].count++; porSegmento[seg].gmv += (c.gmv || 0);
    });
    var linhas = Object.keys(porSegmento).sort(function (a, b) { return porSegmento[b].gmv - porSegmento[a].gmv; }).map(function (seg) {
      var s = porSegmento[seg];
      return '<tr><td>' + escapeHtml(seg) + '</td><td>' + s.count + '</td><td>' + fmtBRL(s.gmv) + '</td></tr>';
    }).join("");
    return '<div class="card"><div class="section-title">Carteira por segmento</div>' +
      '<div class="table-scroll"><table class="data-table"><thead><tr><th>Segmento</th><th>Clientes</th><th>GMV</th></tr></thead><tbody>' +
      (linhas || '<tr><td colspan="3"><div class="empty-state">Sem dados.</div></td></tr>') + '</tbody></table></div></div>';
  }

  function renderRotinaMensal() {
    var hist = historicoMensalPorCW();
    var todos = clientesDoPerfil();
    var gmvTotalMes = {};
    todos.forEach(function (c) { if (c.cw) { var m = c.cw.slice(0, 7); gmvTotalMes[m] = (gmvTotalMes[m] || 0) + (c.gmv || 0); } });
    var linhas = hist.map(function (h) {
      return '<tr><td>' + h.mes + '</td><td>' + h.total + ' clientes fechados</td><td>' + fmtBRL(gmvTotalMes[h.mes] || 0) + '</td></tr>';
    }).join("");
    return '<div class="card"><div class="section-title">Resumo mensal (por CW)</div>' +
      '<div class="table-scroll"><table class="data-table"><thead><tr><th>Mês</th><th>Fechados</th><th>GMV</th></tr></thead><tbody>' +
      (linhas || '<tr><td colspan="3"><div class="empty-state">Sem dados.</div></td></tr>') + '</tbody></table></div></div>';
  }

  function nivelPorPontos(pontos) {
    if (pontos >= 600) return { nome: "Diamante", cls: "level-diamante" };
    if (pontos >= 300) return { nome: "Ouro", cls: "level-ouro" };
    if (pontos >= 100) return { nome: "Prata", cls: "level-prata" };
    return { nome: "Bronze", cls: "level-bronze" };
  }
  function pontosDoPerfil(nome) {
    return state.missoes.reduce(function (total, m) {
      var a = (m.atribuicoes || []).filter(function (x) { return x.pessoa === nome && x.completo; });
      return total + a.length * (m.pontos || 0);
    }, 0);
  }

  function renderRotinaMissoes() {
    var meusPontos = pontosDoPerfil(state.perfil);
    var nivel = nivelPorPontos(meusPontos);
    var cards = state.missoes.map(function (m) {
      var minhaAtribuicao = (m.atribuicoes || []).filter(function (a) { return a.pessoa === state.perfil; })[0];
      var atribuicoesTexto = (m.atribuicoes || []).map(function (a) {
        return a.pessoa + (a.completo ? " ✓" : "");
      }).join(", ");
      return '<div class="mission-card">' +
        '<div style="display:flex;justify-content:space-between;"><b>' + escapeHtml(m.titulo) + '</b><span class="mission-points">+' + m.pontos + ' pts</span></div>' +
        '<div style="font-size:13px;color:var(--c-gray);margin:6px 0;">' + escapeHtml(m.descricao || "") + '</div>' +
        '<div style="font-size:12px;color:var(--c-gray);">Prazo: ' + fmtDate(m.prazo) + ' · Atribuído: ' + escapeHtml(atribuicoesTexto || "—") + '</div>' +
        (minhaAtribuicao && !minhaAtribuicao.completo ? '<button class="btn small subtle" data-completar-missao="' + m.id + '" style="margin-top:8px;">Marcar como concluída</button>' : "") +
        (isAdmin() ? '<button class="btn small ghost" data-remover-missao="' + m.id + '" style="margin-top:8px;margin-left:6px;">Remover</button>' : "") +
      '</div>';
    }).join("");
    var formNovaMissao = isAdmin() ? (
      '<div class="card"><div class="section-title">Nova missão</div>' +
        '<div class="field"><label>Título</label><input type="text" id="missaoTitulo"/></div>' +
        '<div class="field"><label>Descrição</label><input type="text" id="missaoDescricao"/></div>' +
        '<div class="field"><label>Pontos</label><input type="text" id="missaoPontos" value="50"/></div>' +
        '<div class="field"><label>Prazo</label><input type="text" id="missaoPrazo" placeholder="yyyy-mm-dd"/></div>' +
        '<div class="field"><label>Atribuir a</label>' +
          ["Madu", "Pedro", "Josiane", "Ilana"].map(function (n) { return '<label style="margin-right:10px;"><input type="checkbox" data-missao-pessoa="' + n + '"/> ' + n + '</label>'; }).join("") +
        '</div>' +
        '<button class="btn" id="btnCriarMissao">Criar missão</button>' +
      '</div>'
    ) : "";
    return '' +
      '<div class="card"><div class="hero-meta">' +
        '<div><div class="section-title">Seus pontos</div><div style="font-family:var(--font-display);font-size:28px;font-weight:700;">' + meusPontos + '</div><span class="level-pill ' + nivel.cls + '">' + nivel.nome + '</span></div>' +
      '</div></div>' +
      formNovaMissao +
      '<div class="section-title" style="margin-top:16px;">Missões ativas</div>' +
      (cards || '<div class="empty-state">Nenhuma missão criada ainda.</div>');
  }

  function bindRotina() {
    document.querySelectorAll("[data-subtab]").forEach(function (btn) {
      btn.addEventListener("click", function () { state.rotinaSubaba = btn.getAttribute("data-subtab"); rerenderScreenContent(); });
    });
    document.querySelectorAll("[data-cliente-id]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.clienteSelecionado = el.getAttribute("data-cliente-id");
        state.clienteAba = "cronograma"; state.screen = "perfil"; render();
      });
    });
    document.querySelectorAll("[data-checklist-idx]").forEach(function (chk) {
      chk.addEventListener("change", function () {
        var semana = chaveSemanaAtual();
        var key = "dboChecklist_" + state.perfil + "_" + semana;
        var salvo = {};
        try { salvo = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) {}
        salvo[chk.getAttribute("data-checklist-idx")] = chk.checked;
        localStorage.setItem(key, JSON.stringify(salvo));
        rerenderScreenContent();
      });
    });
    var btnCriar = document.getElementById("btnCriarMissao");
    if (btnCriar) btnCriar.addEventListener("click", function () {
      var atribuidoPara = Array.prototype.slice.call(document.querySelectorAll("[data-missao-pessoa]:checked")).map(function (c) { return c.getAttribute("data-missao-pessoa"); });
      var missao = {
        titulo: document.getElementById("missaoTitulo").value,
        descricao: document.getElementById("missaoDescricao").value,
        pontos: Number(document.getElementById("missaoPontos").value) || 0,
        prazo: document.getElementById("missaoPrazo").value,
        atribuidoPara: atribuidoPara
      };
      if (!missao.titulo || !atribuidoPara.length) { toast("Preencha o título e escolha ao menos uma pessoa."); return; }
      withGsRun(function (res) {
        state.missoes.push({ id: res.id, titulo: missao.titulo, descricao: missao.descricao, pontos: missao.pontos, prazo: missao.prazo, criadoPor: state.perfil, criadoEm: new Date().toISOString().slice(0, 10), atribuicoes: atribuidoPara.map(function (p) { return { pessoa: p, completo: false, completoEm: null }; }) });
        toast("Missão criada.");
        rerenderScreenContent();
      }).createMissao(state.session.token, missao, state.perfil);
    });
    document.querySelectorAll("[data-completar-missao]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-completar-missao");
        withGsRun(function () {
          var m = state.missoes.filter(function (x) { return x.id === id; })[0];
          if (m) m.atribuicoes.forEach(function (a) { if (a.pessoa === state.perfil) { a.completo = true; a.completoEm = new Date().toISOString().slice(0, 10); } });
          toast("Missão concluída!");
          rerenderScreenContent();
        }).completeMissaoTask(state.session.token, id, state.perfil);
      });
    });
    document.querySelectorAll("[data-remover-missao]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-remover-missao");
        if (!confirm("Remover esta missão?")) return;
        withGsRun(function () {
          state.missoes = state.missoes.filter(function (x) { return x.id !== id; });
          rerenderScreenContent();
        }).deleteMissao(state.session.token, id, state.perfil);
      });
    });
  }

  applyTheme();
  render();
</script>
