<script>
(function () {
  "use strict";

  // Preferência local de qual nome está filtrando a lista/Analytics — não é mais a

  var ASSIGNABLE = ["Ilana", "Pedro", "Josiane", "Madu"];

  // Pilares de atuação (usados para classificar tarefas e no gráfico do Analytics)

    relacionamento: { emoji: "🟢", nome: "Relacionamento", cor: "#2F8F5B" },
    estrategia: { emoji: "🔵", nome: "Estratégia", cor: "#2F5FA8" },
    capacitacao: { emoji: "🟡", nome: "Capacitação", cor: "#FFD450" }
  };
  function sortedPilaresKey(arr) {
    return arr.slice().sort().join(",");
  }

  // As 7 combinações da legenda — "keys" é a combinação exata de pilares base que
  // define a categoria; "key" é a chave canônica usada para classificar cada tarefa.

    { keys: ["relacionamento"], emoji: "🟢", nome: "Relacionamento", objetivo: "Construir confiança" },

    { keys: ["capacitacao"], emoji: "🟡", nome: "Capacitação", objetivo: "Desenvolver" },
    { keys: ["relacionamento", "estrategia"], emoji: "🟢🔵", nome: "Inteligência do Cliente", objetivo: "Personalizar" },
    { keys: ["estrategia", "capacitacao"], emoji: "🔵🟡", nome: "Enablement Estratégico", objetivo: "Preparar" },
    { keys: ["relacionamento", "capacitacao"], emoji: "🟢🟡", nome: "Customer Enablement", objetivo: "Engajar" },
    { keys: ["relacionamento", "estrategia", "capacitacao"], emoji: "🟢🔵🟡", nome: "Customer Success", objetivo: "Gerar resultado" }

    p.key = sortedPilaresKey(p.keys);

      ? PILARES_BASE[p.keys[0]].cor
      : "linear-gradient(90deg, " + p.keys.map(function (k) { return PILARES_BASE[k].cor; }).join(", ") + ")";
  });

  // Ponte com o servidor (Code.gs) via google.script.run, envelopada em Promise pra
  // poder usar .then()/.catch() como o resto do código já fazia com o Supabase.
  var GS_TOKEN_KEY = "hm_team_token_v1";
  function gsRun(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); });
      runner[fnName].apply(runner, args);
    });
  }

  // Token de sessão do time — null quando ninguém do time está logado (ex.: link
  // público do cliente). É essa variável, não o "currentUser" (nome escolhido na
  // lista), que decide o que pode ser lido/editado; currentUser continua sendo só
  // uma preferência de filtro, agora só relevante depois de já estar logado.
  var session = localStorage.getItem(GS_TOKEN_KEY) || null;

  var app = document.getElementById("app");
  var heroBanner = document.getElementById("hero-banner");
  var copyBtn = document.getElementById("copy-link-btn");
  var exportBtn = document.getElementById("export-btn");
  var addClientBtn = document.getElementById("add-client-btn");
  var analyticsBtn = document.getElementById("analytics-btn");
  var profileBtn = document.getElementById("profile-btn");
  var profileBtnLabel = document.getElementById("profile-btn-label");
  var logoutBtn = document.getElementById("logout-btn");
  var modal = document.getElementById("add-client-modal");
  var addClientForm = document.getElementById("add-client-form");
  var addClientError = document.getElementById("add-client-error");
  var confirmModal = document.getElementById("confirm-modal");
  var confirmModalTitle = document.getElementById("confirm-modal-title");
  var confirmModalMessage = document.getElementById("confirm-modal-message");
  var confirmModalConfirmBtn = document.getElementById("confirm-modal-confirm");
  var confirmModalCallback = null;
  var photoInput = document.getElementById("photo-input");

  var store = {}; // { [slug]: cliente } — vem da planilha (aba Clientes)
  var crmStore = {}; // { [slug]: { endereco, aniversario, ... } } — vem da planilha (aba CRM)
  var currentUser = localStorage.getItem(PROFILE_KEY) || null;
  if (currentUser === "Amanda") {
    // migração: nome antigo do perfil de administração
    currentUser = ADMIN;
    localStorage.setItem(PROFILE_KEY, currentUser);
  }
  var currentSlug = null;
  var openPhases = new Set();
  var addingTaskFor = new Set();
  var analyticsFilter = new Set(ASSIGNABLE);
  // Deslocamento (em meses) do card "Aniversariantes do mês" em relação ao mês atual —
  // 0 é sempre o mês vigente. Fica só em memória (não é salvo no localStorage) e é
  // resetado toda vez que se entra na tela de Analytics vindo de outra tela, para nunca
  // "lembrar" o último mês navegado.
  var birthdayMonthOffset = 0;
  var lastViewKey = null;

  // ---------- Template para novos clientes ----------

  var TEMPLATE_FASES = [
    {
      titulo: "Setup de Conta",
      descricao: "Criação e configuração inicial da conta do cliente na Hotmart.",
      responsavel: "Suporte Técnico",
      tarefas: [
        { nome: "Envio de dados de migração", pilares: ["estrategia"] },
        { nome: "Completar cadastro da conta", pilares: ["estrategia"] }
      ]
    },
    {
      titulo: "Treinamento: Configurações Básicas",
      descricao: "Treinamento sobre as configurações essenciais da plataforma.",
      responsavel: "Time de Onboarding",
      tarefas: [
        { nome: "Overview e navegação", pilares: ["capacitacao"] },
        { nome: "Cadastro de produtos e formatos", pilares: ["capacitacao"] },
        { nome: "Configurações de checkout", pilares: ["capacitacao"] },
        { nome: "Otimização do checkout", pilares: ["estrategia", "capacitacao"] },
        { nome: "Integrações", pilares: ["capacitacao"] }
      ]
    },
    {

      descricao: "Treinamento e estruturação da área de membros (Club).",

      tarefas: [
        { nome: "Navegação básica e ocultar produtos", pilares: ["capacitacao"] },
        { nome: "Gestão de conteúdo", pilares: ["capacitacao"] },
        { nome: "Club Sales", pilares: ["estrategia", "capacitacao"] },
        { nome: "Gestão de turmas e agendamento", pilares: ["capacitacao"] },
        { nome: "Capas de módulos, aulas e trilhas", pilares: ["capacitacao"] },

    {

        { nome: "Primeiros 10k após início da parceria", pilares: ["relacionamento", "estrategia", "capacitacao"] }

    },
    {
      titulo: "Relatórios Gerenciais (pós-ativação)",
      descricao: "Acompanhamento dos primeiros indicadores após a ativação.",
      responsavel: "Estrategista de Conta",
      tarefas: [
        { nome: "Relatório de Agente IA", pilares: ["estrategia"] },
        { nome: "Gestão de vendas e relatórios de vendas", pilares: ["estrategia"] },
        { nome: "Desempenho de checkout com Analytics", pilares: ["estrategia"] },

  function cloneTemplateFases() {
    return TEMPLATE_FASES.map(function (fase, fi) {
      return {
        titulo: fase.titulo,
        descricao: fase.descricao,
        responsavel: fase.responsavel,
        tarefas: fase.tarefas.map(function (t, ti) {
          return {
            id: "f" + (fi + 1) + "t" + (ti + 1),
            nome: t.nome,
            pilares: t.pilares.slice(),
            concluida: false,
            data: null,
            removida: false
          };
        })
      };
    });
  }

  // ---------- Persistência (Google Apps Script + Planilha) ----------
  // store/crmStore continuam sendo objetos JS em memória, no mesmo formato de sempre —
  // o servidor (Code.gs) já devolve/recebe os objetos no mesmo formato camelCase que o
  // resto do app usa, então não precisa de conversão de formato aqui (diferente da
  // versão anterior com Supabase, que tinha colunas snake_case). As funções de
  // renderização não mudam.

  // Se uma chamada ao servidor falhar por sessão expirada (AUTH_EXPIRED, ver
  // requireSession_ no Code.gs), limpa a sessão local e manda pra tela de login, em
  // vez de mostrar um erro genérico.
  function handleAuthError_(err) {
    var msg = (err && err.message) || String(err);
    if (msg.indexOf("AUTH_EXPIRED") !== -1) {
      session = null;
      localStorage.removeItem(GS_TOKEN_KEY);
      store = {};
      crmStore = {};
      render();
      return true;
    }
    return false;
  }

  // Time logado: carrega TODOS os clientes e TODOS os registros de CRM de uma vez.
  function loadTeamData() {
    return gsRun("getTeamData", session).then(function (result) {
      var newStore = {};
      (result.clientes || []).forEach(function (c) { newStore[c.slug] = c; });
      var newCrmStore = {};
      (result.crm || []).forEach(function (c) { newCrmStore[c.slug] = c; });
      store = newStore;
      crmStore = newCrmStore;
    });
  }

  // Link público (sem login): só consegue ler UM cliente por vez (getPublicClient no
  // Code.gs) — nunca lista os outros, nunca vê CRM.
  function loadPublicClient(slug) {
    return gsRun("getPublicClient", slug).then(function (cliente) {
      store = {};
      crmStore = {};
      if (cliente) store[slug] = cliente;
    });
  }

  // Salva só o registro desse cliente (não a planilha inteira) — fire-and-forget: a UI
  // já foi atualizada de forma otimista antes desta chamada, então erro aqui só
  // precisa avisar a pessoa, não travar a interface.
  function persistClient(slug) {
    var cliente = store[slug];
    if (!cliente) return;
    gsRun("saveClient", session, slug, cliente).catch(function (err) {
      if (handleAuthError_(err)) return;
      console.error(err);
      window.alert("Não foi possível salvar essa alteração (" + err.message + "). Verifique sua conexão e tente de novo.");
    });
  }

  function persistCrmClient(slug) {
    gsRun("saveCrm", session, slug, getCrm(slug)).catch(function (err) {
      if (handleAuthError_(err)) return;
      console.error(err);
      window.alert("Não foi possível salvar esse dado de CRM (" + err.message + "). Verifique sua conexão e tente de novo.");
    });
  }

  function crmDefaults() {
    return {
      idCliente: "",
      telefonePrincipal: "",
      emailCliente: "",
      endereco: "",
      aniversario: null,
      eventoParticipa: false,
      eventoQual: "",
      contratoAssinado: false,
      brindeEnviado: false,
      metaFaturamento: "",
      equipe: [],
      acoes: []
    };
  }

  // Mescla com os defaults (não só substitui) para não quebrar quando o registro foi
  // salvo antes de um campo novo existir.
  function getCrm(slug) {
    var defaults = crmDefaults();
    var saved = crmStore[slug] || {};
    var merged = Object.assign(defaults, saved);
    merged.equipe = saved.equipe || [];
    merged.acoes = saved.acoes || [];
    return merged;
  }

  // Não chama refresh(): o próprio input/textarea/date já mostra o valor digitado
  // nativamente. Recriar o DOM a cada tecla/blur causaria uma corrida entre campos
  // vizinhos (o próximo "fill" foca o campo seguinte, disparando o "change" do atual
  // no meio de um refresh e perdendo valor). Quem precisa de refresh (ex.: toggles
  // sim/não, que mudam o que é exibido) chama refresh() explicitamente depois.
  function setCrmField(slug, field, value) {
    var current = getCrm(slug);
    current[field] = value;
    crmStore[slug] = current;
    persistCrmClient(slug);
  }

  function addTeamMember(slug) {
    var current = getCrm(slug);
    current.equipe.push({ nome: "", cargo: "", telefone: "", email: "" });
    crmStore[slug] = current;
    persistCrmClient(slug);
    refresh();
  }

  // Mesma razão do setCrmField acima: sem refresh(), para não perder valores dos
  // outros campos da mesma linha quando o foco muda rápido entre eles.
  function setTeamMemberField(slug, idx, field, value) {
    var current = getCrm(slug);
    if (!current.equipe[idx]) return;
    current.equipe[idx][field] = value;
    crmStore[slug] = current;
    persistCrmClient(slug);
  }

  function removeTeamMember(slug, idx) {
    var current = getCrm(slug);
    current.equipe.splice(idx, 1);
    crmStore[slug] = current;
    persistCrmClient(slug);
    refresh();
  }

  function addRelationshipAction(slug) {
    var current = getCrm(slug);
    current.acoes.push({ data: todayISO(), descricao: "" });
    crmStore[slug] = current;
    persistCrmClient(slug);
    refresh();
  }

  // Mesma razão do setCrmField acima: sem refresh(), para não perder valores dos
  // outros campos da mesma entrada quando o foco muda rápido entre eles.
  function setRelationshipActionField(slug, idx, field, value) {
    var current = getCrm(slug);
    if (!current.acoes[idx]) return;
    current.acoes[idx][field] = value;
    crmStore[slug] = current;
    persistCrmClient(slug);
  }

  function removeRelationshipAction(slug, idx) {
    var current = getCrm(slug);
    current.acoes.splice(idx, 1);
    crmStore[slug] = current;
    persistCrmClient(slug);
    refresh();
  }

  // ---------- Utilidades ----------

  function slugify(text) {
    return (text || "")
      .toString()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "") || "cliente";
  }

  function uniqueSlug(base) {
    var slug = base;
    var n = 2;
    while (store[slug]) {
      slug = base + "-" + n;
      n++;
    }
    return slug;
  }

  function initials(nome) {
    var parts = (nome || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "??";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatDate(isoString) {
    if (!isoString) return null;
    var parts = isoString.split("-");
    var d = new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]));
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" });
  }

  function escapeHtml(str) {
    return (str || "").toString().replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function avatarInnerHtml(cliente) {
    if (cliente.foto) {
      return '<img class="avatar-img" src="' + cliente.foto + '" alt="" />';
    }
    return escapeHtml(cliente.inicial);
  }

  function cameraIconSvg() {
    return (
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="14" r="3.2"/>' +
      "</svg>"
    );
  }

  // ---------- Perfil / permissões ----------
  // Não é autenticação: é uma preferência local (localStorage) para filtrar a lista de
  // clientes por responsável. Um link direto de cliente (?cliente=slug) nunca é
  // bloqueado por isso — só a lista/analytics internos são filtrados.

  function visibleSlugs() {
    var all = Object.keys(store);
    if (currentUser === ADMIN) return all;
    return all.filter(function (s) { return store[s].responsavelCliente === currentUser; });

  function updateProfileButton() {
    profileBtnLabel.textContent = currentUser ? "👤 " + currentUser + " · trocar" : "Selecionar perfil";
    profileBtn.classList.toggle("is-set", !!currentUser);

    currentUser = null;
    localStorage.removeItem(PROFILE_KEY);
    setParams({ cliente: null, view: null });

  // ---------- Autenticação do time (senha única + token de sessão) ----------
  // Isto é a fronteira de segurança de verdade — diferente do "currentUser" acima,
  // que é só uma preferência de filtro. Sem sessão, a pessoa só enxerga o que o link
  // público de UM cliente específico permite (ver loadPublicClient/RLS).

  // Mostra/esconde os botões da topbar que só fazem sentido para o time logado.
  // Chamado em todo render(), então reage sozinho a login/logout.
  function updateTeamChrome() {
    var show = !!session;
    analyticsBtn.style.display = show ? "" : "none";
    addClientBtn.style.display = show ? "" : "none";
    exportBtn.style.display = show ? "" : "none";
    profileBtn.style.display = show ? "" : "none";
    logoutBtn.hidden = !show;
  }

  function renderLoginGate(errorMsg) {
    copyBtn.style.display = "none";
    var wrap = document.createElement("section");
    wrap.className = "picker";
    wrap.innerHTML =
      '<div class="picker__card">' +
        '<h1 class="picker__heading">Login do time</h1>' +
        "<p class=\"picker__text\">Digite a senha do time para acessar a lista de clientes, " +
          "o Analytics e o CRM. Quem só tem o link de um cliente específico não precisa fazer login — " +
          "esse link continua funcionando normalmente.</p>" +
        '<form id="login-form">' +
          '<label class="field">' +
            '<span class="field__label">Senha do time</span>' +
            '<input class="field__input" type="password" name="senha" required autocomplete="current-password" autofocus />' +
          "</label>" +
          (errorMsg ? '<p class="modal__error">' + escapeHtml(errorMsg) + "</p>" : "") +
          '<div class="modal__actions" style="justify-content:flex-start;margin-top:4px;">' +
            '<button type="submit" class="btn btn--primary">Entrar</button>' +
          "</div>" +
        "</form>" +
      "</div>";
    app.innerHTML = "";
    app.appendChild(wrap);

    var form = wrap.querySelector("#login-form");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var fd = new FormData(form);
      var senha = (fd.get("senha") || "").toString();
      var btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = "Entrando…";
      gsRun("login", senha).then(function (result) {
        session = result.token;
        localStorage.setItem(GS_TOKEN_KEY, session);
        bootTeam();
      }).catch(function (err) {
        renderLoginGate("Não foi possível entrar: " + err.message);
      });
    });
  }

  function logout() {
    var token = session;
    session = null;
    localStorage.removeItem(GS_TOKEN_KEY);
    store = {};
    crmStore = {};
    currentUser = null;
    localStorage.removeItem(PROFILE_KEY);
    navigateTo({ type: "picker" });
    gsRun("logout", token).catch(function () {}); // best-effort, não bloqueia o logout local
  }

  // ---------- Cálculo de progresso ----------

  function activeTasks(fase) {
    return fase.tarefas.filter(function (t) { return !t.removida; });
  }

  function faseProgress(fase) {
    var active = activeTasks(fase);
    var done = active.filter(function (t) { return t.concluida; }).length;
    var total = active.length;
    return { done: done, total: total, pct: total ? done / total : 1 };
  }

  function clientProgress(cliente) {
    var done = 0, total = 0;
    cliente.fases.forEach(function (fase) {
      var p = faseProgress(fase);
      done += p.done;
      total += p.total;
    });
    return total ? Math.round((done / total) * 100) : 0;
  }

  // Conta, entre as tarefas ativas e concluídas, quantas caem em cada uma das 7
  // combinações de pilares da legenda — pela combinação EXATA de pilares da tarefa,
  // não decompondo pilares combinados em contagens separadas por pilar base.
  function pilarCombCounts(cliente) {
    var counts = {};
    PILARES_LEGEND.forEach(function (p) { counts[p.key] = 0; });
    cliente.fases.forEach(function (fase) {
      fase.tarefas.forEach(function (t) {
        if (t.removida || !t.concluida) return;
        if (!t.pilares || !t.pilares.length) return;
        var key = sortedPilaresKey(t.pilares);
        if (counts.hasOwnProperty(key)) counts[key]++;
      });
    });
    return counts;
  }

  // status de cada fase: a primeira fase incompleta é "atual"; antes dela, "concluida"; depois, "pendente"
  function faseStatuses(cliente) {
    var statuses = [];
    var passedCurrent = false;
    cliente.fases.forEach(function (fase) {
      var pct = faseProgress(fase).pct;
      if (pct >= 1) {
        statuses.push("concluida");
      } else if (!passedCurrent) {
        statuses.push("atual");
        passedCurrent = true;
      } else {
        statuses.push("pendente");
      }
    });
    return statuses;
  }

  // ---------- Mutações ----------

  function findTask(cliente, faseIdx, taskId) {
    var fase = cliente.fases[faseIdx];
    if (!fase) return null;
    return fase.tarefas.filter(function (t) { return t.id === taskId; })[0] || null;
  }

  function toggleTask(slug, faseIdx, taskId) {
    var cliente = store[slug];
    var task = findTask(cliente, faseIdx, taskId);
    if (!task) return;
    task.concluida = !task.concluida;
    if (task.concluida && !task.data) task.data = todayISO();
    persistClient(slug);
    refresh();
  }

  function setTaskDate(slug, faseIdx, taskId, value) {
    var cliente = store[slug];
    var task = findTask(cliente, faseIdx, taskId);
    if (!task) return;
    task.data = value || null;
    persistClient(slug);
    refresh();
  }

  function removeTask(slug, faseIdx, taskId) {
    var cliente = store[slug];
    var task = findTask(cliente, faseIdx, taskId);
    if (!task) return;
    task.removida = true;
    persistClient(slug);
    refresh();
  }

  function restoreTask(slug, faseIdx, taskId) {
    var cliente = store[slug];
    var task = findTask(cliente, faseIdx, taskId);
    if (!task) return;
    task.removida = false;
    persistClient(slug);
    refresh();
  }

  function deleteTaskForever(slug, faseIdx, taskId) {
    var cliente = store[slug];
    var fase = cliente.fases[faseIdx];
    if (!fase) return;
    fase.tarefas = fase.tarefas.filter(function (t) { return t.id !== taskId; });
    persistClient(slug);
    refresh();
  }

  function addTask(slug, faseIdx, nome) {
    var cliente = store[slug];
    var fase = cliente.fases[faseIdx];
    if (!fase) return;
    var idx = fase.tarefas.length + 1;
    var id = "f" + (faseIdx + 1) + "-custom-" + idx;
    while (fase.tarefas.some(function (t) { return t.id === id; })) {
      idx++;
      id = "f" + (faseIdx + 1) + "-custom-" + idx;
    }
    fase.tarefas.push({ id: id, nome: nome, concluida: false, data: null, removida: false, custom: true });
    persistClient(slug);
  }

  // Assíncrono — diferente das outras mutações, que atualizam o store local de forma
  // otimista e só depois salvam em segundo plano: aqui é melhor esperar a confirmação
  // da planilha antes de navegar para o cliente novo, para não levar a pessoa a uma
  // tela cujo cliente não foi salvo de verdade.
  function addClient(fields) {
    var slug = uniqueSlug(slugify(fields.nome));
    var cliente = {
      nome: fields.nome,
      empresa: fields.empresa || "",
      inicial: initials(fields.nome),
      idConta: fields.idConta || "",
      responsavelCliente: fields.responsavelCliente || "",
      criadoPor: currentUser || "",
      dataInicio: fields.dataInicio || todayISO(),
      foto: null,
      fases: cloneTemplateFases()
    };
    return gsRun("createClient", session, slug, cliente).then(function () {
      store[slug] = cliente;
      return slug;
    });
  }

  // Também assíncrono, pelo mesmo motivo: só sai da tela / navega de volta para a
  // lista depois de confirmar que a exclusão foi aceita pela planilha.
  function deleteClient(slug) {
    return gsRun("deleteClient", session, slug).then(function () {
      delete store[slug];
      delete crmStore[slug];
    });
  }

  // Redimensiona a imagem no cliente (canvas) antes de salvar como data URL,
  // para não inflar o localStorage com fotos em resolução alta.
  function resizeImageFile(file, maxSize) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.85));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // mês vigente); as setas só mudam esse deslocamento em memória, nunca o mês padrão.
  function birthdaysHtml(slugs) {
    var now = new Date();
    var base = new Date(now.getFullYear(), now.getMonth() + birthdayMonthOffset, 1);
    var targetMonth = base.getMonth() + 1;
    var targetYear = base.getFullYear();
    var isCurrentMonth = birthdayMonthOffset === 0;

    var items = slugs
      .map(function (slug) {
        var crm = crmStore[slug];
        if (!crm || !crm.aniversario) return null;
        var mes = +crm.aniversario.slice(5, 7);
        if (mes !== targetMonth) return null;
        var dia = +crm.aniversario.slice(8, 10);
        return { slug: slug, nome: store[slug].nome, dia: dia };
      })
      .filter(Boolean)
      .sort(function (a, b) { return a.dia - b.dia; });

    var emptyMsg = isCurrentMonth
      ? "Nenhum aniversariante este mês (com base no CRM preenchido neste navegador)."

              '<span class="birthday-row__day">' + (it.dia < 10 ? "0" + it.dia : it.dia) + "</span>" +

        '<path d="M5 21v-7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7" />' +
        '<path d="M12 12V7" />' +
        '<path d="M12 7c-1 0-1.5-.7-1.5-1.5S12 3 12 3s1.5.7 1.5 1.5S13 7 12 7z" />' +

    // somem; o campo de data continua visível, só desabilitado — dá pra ver a data

    if (!session) {

  // ---------- Roteamento ----------

  // Roteamento 100% em memória — o Apps Script serve a página dentro de um iframe
  // isolado (sandbox do próprio Google), então window.location/history não refletem a
  // URL real do deployment como num site normal, e não dá pra confiar em <a href="?...">
  // + reload. Por isso currentView é uma variável JS comum, e toda navegação interna
  // passa por navigateTo()/os goTo*, nunca por mudar a URL.
  //
  // A ÚNICA vez que os parâmetros da URL importam de verdade é no carregamento inicial
  // da página (alguém abrindo um link do tipo .../exec?cliente=slug direto) — esses
  // parâmetros chegam via GAS_INITIAL_PARAMS, injetado pelo servidor (Code.gs) no HTML,
  // já que window.location.search não é confiável aqui.
  var currentView = { type: "picker" };
  var usedInitialParams = false;

  function getView() {
    if (!usedInitialParams) {
      usedInitialParams = true;
      var slug = window.GAS_INITIAL_PARAMS && window.GAS_INITIAL_PARAMS.cliente;
      var viewParam = window.GAS_INITIAL_PARAMS && window.GAS_INITIAL_PARAMS.view;
      if (slug) {
        currentView = (viewParam === "crm" && session)
          ? { type: "crm", slug: slug }
          : { type: "client", slug: slug };
      } else if (viewParam === "analytics") {
        currentView = { type: "analytics" };
      }
    }
    return currentView;
  }

  function render() {
    var view = getView();
    updateProfileButton();
    updateTeamChrome();

    var viewKey = view.type + (view.slug ? ":" + view.slug : "");
    if (view.type === "analytics" && lastViewKey !== "analytics") {
      birthdayMonthOffset = 0;
    }
    lastViewKey = viewKey;

    // A view de cliente funciona tanto para quem está logado (time) quanto para quem
    // só tem o link público — o que muda é se store[slug] foi carregado via
    // loadTeamData() (tudo) ou loadPublicClient() (só esse cliente), e se os
    // controles de edição aparecem (ver renderClient/session).
    if (view.type === "client") {
      heroBanner.hidden = true;
      currentSlug = view.slug;
      if (!store[view.slug]) {
        openPhases = new Set();
        renderNotFound();
        return;
      }
      renderClient(view.slug);
      return;
    }

    // CRM e a lista/Analytics são sempre restritos ao time: sem sessão, cai no login.
    if (!session) {
      currentSlug = null;
      heroBanner.hidden = false;
      renderLoginGate();
      return;
    }

    if (view.type === "crm") {
      heroBanner.hidden = true;
      currentSlug = view.slug;
      if (!store[view.slug]) {
        openPhases = new Set();
        renderNotFound();
        return;
      }
      renderCrm(view.slug);
      return;
    }

    currentSlug = null;
    if (!currentUser) {
      heroBanner.hidden = false;
      renderProfileGate();
      return;
    }
    if (view.type === "analytics") {
      heroBanner.hidden = true;
      renderAnalytics();
    } else {
      heroBanner.hidden = false;
      renderPicker();
    }
  }

  function refresh() {
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }

  function navigateTo(view) {
    currentView = view;
    openPhases = new Set();
    addingTaskFor = new Set();
    refresh();
  }

  function goToPicker() { navigateTo({ type: "picker" }); }
  function goToAnalytics() { navigateTo({ type: "analytics" }); }
  function goToClient(slug) { navigateTo({ type: "client", slug: slug }); }
  function goToCrm(slug) { navigateTo({ type: "crm", slug: slug }); }

  // URL compartilhável de um cliente — construída a partir da URL base do deployment
  // (injetada pelo servidor, ver GAS_BASE_URL), já que window.location não é
  // confiável dentro do sandbox do Apps Script.
  function clientShareUrl(slug) {
    return window.GAS_BASE_URL + "?cliente=" + encodeURIComponent(slug);
  }

  // ---------- Eventos ----------

  app.addEventListener("click", function (e) {
    var backEl = e.target.closest('[data-action="nav-back"]');
    if (backEl) {
      e.preventDefault();
      goToPicker();
      return;
    }

    var backClientEl = e.target.closest('[data-action="nav-back-client"]');
    if (backClientEl) {
      e.preventDefault();
      goToClient(backClientEl.getAttribute("data-slug"));
      return;
    }

    // Links pra um cliente específico (lista de clientes, barras do Analytics, cards
    // de pilares, aniversariantes) — sempre interceptados: dentro do sandbox do Apps
    // Script, deixar o navegador seguir o <a href> de verdade não funciona como
    // navegação de rota (ver comentário em getView()).
    var navClientEl = e.target.closest('[data-action="nav-client"]');
    if (navClientEl) {
      e.preventDefault();
      goToClient(navClientEl.getAttribute("data-slug"));
      return;
    }

    var target = e.target.closest("[data-action]");
    if (!target) return;
    var action = target.getAttribute("data-action");
    var slug = currentSlug;
    var faseIdx = target.hasAttribute("data-fase") ? +target.getAttribute("data-fase") : null;
    var taskId = target.getAttribute("data-task");

    if (action === "toggle-phase") {
      if (openPhases.has(faseIdx)) {
        openPhases.delete(faseIdx);
      } else {
        openPhases.add(faseIdx);
      }
      refresh();
    } else if (action === "toggle-task") {
      toggleTask(slug, faseIdx, taskId);
    } else if (action === "remove-task") {
      removeTask(slug, faseIdx, taskId);
    } else if (action === "restore-task") {
      restoreTask(slug, faseIdx, taskId);
    } else if (action === "show-add-task") {
      addingTaskFor.add(faseIdx);
      refresh();
    } else if (action === "cancel-add-task") {
      addingTaskFor.delete(faseIdx);
      refresh();
    } else if (action === "delete-task-forever") {
      if (window.confirm("Excluir esta tarefa definitivamente? Essa ação não pode ser desfeita.")) {
        deleteTaskForever(slug, faseIdx, taskId);
      }
    } else if (action === "toggle-onboarder-filter") {
      var name = target.getAttribute("data-name");
      if (analyticsFilter.has(name)) analyticsFilter.delete(name);
      else analyticsFilter.add(name);
      refresh();
    } else if (action === "filter-select-all") {
      analyticsFilter = new Set(ASSIGNABLE);
      refresh();
    } else if (action === "filter-clear") {
      analyticsFilter = new Set();
      refresh();
    } else if (action === "delete-client") {
      var clienteAtual = store[slug];
      if (!clienteAtual) return;
      openConfirmModal(
        "Excluir cliente",
        "Tem certeza que deseja excluir " + clienteAtual.nome + "? Essa ação não pode ser desfeita.",
        function () {
          deleteClient(slug).then(function () {
            goToPicker();
          }).catch(function (err) {
            window.alert("Não foi possível excluir o cliente (" + err.message + ").");
          });
        }
      );
    } else if (action === "upload-photo") {
      photoInput.click();
    } else if (action === "remove-photo") {
      removeClientPhoto(slug);
    } else if (action === "go-crm") {
      if (session) goToCrm(slug);
    } else if (action === "crm-set-bool") {
      var boolField = target.getAttribute("data-field");
      var boolValue = target.getAttribute("data-value") === "true";
      setCrmField(slug, boolField, boolValue);
      refresh();
    } else if (action === "crm-team-add") {
      addTeamMember(slug);
    } else if (action === "crm-team-remove") {
      removeTeamMember(slug, +target.getAttribute("data-idx"));
    } else if (action === "crm-action-add") {
      addRelationshipAction(slug);
    } else if (action === "crm-action-remove") {
      removeRelationshipAction(slug, +target.getAttribute("data-idx"));
    } else if (action === "birthday-month-prev") {
      birthdayMonthOffset -= 1;
      refresh();
    } else if (action === "birthday-month-next") {
      birthdayMonthOffset += 1;
      refresh();
    } else if (action === "birthday-month-reset") {
      birthdayMonthOffset = 0;
      refresh();
    }
  });

  photoInput.addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    var slugParaFoto = currentSlug;
    photoInput.value = "";
    if (!file || !slugParaFoto) return;
    resizeImageFile(file, 240).then(function (dataUrl) {
      setClientPhoto(slugParaFoto, dataUrl);
    });
  });

  app.addEventListener("submit", function (e) {
    var form = e.target;
    if (form.classList.contains("add-task-form")) {
      e.preventDefault();
      var faseIdx = +form.getAttribute("data-fase");
      var input = form.querySelector('input[name="nome"]');
      var nome = input.value.trim();
      if (!nome) return;
      addTask(currentSlug, faseIdx, nome);
      addingTaskFor.delete(faseIdx);
      refresh();
    }
  });

  app.addEventListener("change", function (e) {
    var target = e.target;
    var targetAction = target.getAttribute("data-action");
    if (targetAction === "set-date") {
      var faseIdx = +target.getAttribute("data-fase");
      var taskId = target.getAttribute("data-task");
      setTaskDate(currentSlug, faseIdx, taskId, target.value);
    } else if (targetAction === "crm-set-text") {
      var field = target.getAttribute("data-field");
      setCrmField(currentSlug, field, target.value || (field === "aniversario" ? null : ""));
    } else if (targetAction === "crm-team-set") {
      var teamIdx = +target.getAttribute("data-idx");
      var teamField = target.getAttribute("data-field");
      setTeamMemberField(currentSlug, teamIdx, teamField, target.value);
    } else if (targetAction === "crm-action-set") {
      var actionIdx = +target.getAttribute("data-idx");
      var actionField = target.getAttribute("data-field");
      setRelationshipActionField(currentSlug, actionIdx, actionField, target.value);
    }
  });

  copyBtn.addEventListener("click", function () {
    navigator.clipboard.writeText(clientShareUrl(currentSlug)).then(function () {
      var original = copyBtn.textContent;
      copyBtn.textContent = "Link copiado!";
      copyBtn.classList.add("is-copied");
      setTimeout(function () {
        copyBtn.textContent = original;
        copyBtn.classList.remove("is-copied");
      }, 2000);
    });
  });

  exportBtn.addEventListener("click", function () {
    var payload = JSON.stringify(store, null, 2);
    var blob = new Blob([payload], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "clients.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  analyticsBtn.addEventListener("click", goToAnalytics);
  profileBtn.addEventListener("click", switchProfile);
  logoutBtn.addEventListener("click", logout);

  function openModal() {
    addClientError.hidden = true;
    addClientForm.reset();
    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
    var respSelect = addClientForm.querySelector('select[name="responsavelCliente"]');
    if (respSelect && ASSIGNABLE.indexOf(currentUser) !== -1) respSelect.value = currentUser;
    var firstInput = addClientForm.querySelector('input[name="nome"]');
    if (firstInput) firstInput.focus();
  }

  function closeModal() {
    modal.classList.remove("is-open");
    modal.setAttribute("aria-hidden", "true");
  }

  addClientBtn.addEventListener("click", openModal);

  modal.addEventListener("click", function (e) {
    if (e.target.closest('[data-action="close-modal"]')) closeModal();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && modal.classList.contains("is-open")) closeModal();
    if (e.key === "Escape" && confirmModal.classList.contains("is-open")) closeConfirmModal();
  });

  function openConfirmModal(title, message, onConfirm) {
    confirmModalTitle.textContent = title;
    confirmModalMessage.textContent = message;
    confirmModalCallback = onConfirm;
    confirmModal.classList.add("is-open");
    confirmModal.setAttribute("aria-hidden", "false");
  }

  function closeConfirmModal() {
    confirmModal.classList.remove("is-open");
    confirmModal.setAttribute("aria-hidden", "true");
    confirmModalCallback = null;
  }

  confirmModal.addEventListener("click", function (e) {
    if (e.target.closest('[data-action="close-confirm-modal"]')) closeConfirmModal();
  });

  confirmModalConfirmBtn.addEventListener("click", function () {
    var cb = confirmModalCallback;
    closeConfirmModal();
    if (cb) cb();
  });

  addClientForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var formData = new FormData(addClientForm);
    var nome = (formData.get("nome") || "").toString().trim();
    var responsavelCliente = (formData.get("responsavelCliente") || "").toString().trim();
    if (!nome) {
      addClientError.textContent = "Informe o nome do cliente.";
      addClientError.hidden = false;
      return;
    }
    if (ASSIGNABLE.indexOf(responsavelCliente) === -1) {
      addClientError.textContent = "Selecione um responsável.";
      addClientError.hidden = false;
      return;
    }
    var submitBtn = addClientForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    addClient({
      nome: nome,
      empresa: (formData.get("empresa") || "").toString().trim(),
      idConta: (formData.get("idConta") || "").toString().trim(),
      responsavelCliente: responsavelCliente,
      dataInicio: (formData.get("dataInicio") || "").toString().trim()
    }).then(function (slug) {
      submitBtn.disabled = false;
      closeModal();
      goToClient(slug);
    }).catch(function (err) {
      submitBtn.disabled = false;
      addClientError.textContent = "Não foi possível criar o cliente (" + err.message + ").";
      addClientError.hidden = false;
    });
  });

  // ---------- Início ----------
  // Carrega os dados de acordo com quem está acessando:
  //  - sessão de time ativa (token salvo de uma visita anterior, ou acabou de logar)
  //    -> loadTeamData() (todos os clientes + todo o CRM)
  //  - sem sessão + link de um cliente (?cliente=slug) -> loadPublicClient(slug),
  //    só esse cliente, só leitura
  //  - sem sessão + nenhum link de cliente -> nada pra carregar, cai direto no
  //    login (render() cuida disso sozinho)
  //
  // Não existe um "google.script.run.auth.getSession()" equivalente ao do Supabase —
  // a sessão aqui é só um token guardado em localStorage; se ele já expirou no
  // servidor (CacheService, 6h), a primeira chamada autenticada falha com
  // AUTH_EXPIRED e handleAuthError_ cuida de mandar de volta pro login.

  function bootTeam() {
    loadTeamData()
      .then(function () {
        render();
      })
      .catch(function (err) {
        if (handleAuthError_(err)) return;
        app.innerHTML = '<div class="loading">Não foi possível carregar os dados da planilha. ' +
          "Recarregue a página; se persistir, verifique a conexão ou avise o time técnico.</div>";
        console.error(err);
      });
  }

  function bootPublic(slug) {
    loadPublicClient(slug)
      .then(function () {
        render();
      })
      .catch(function (err) {
        app.innerHTML = '<div class="loading">Não foi possível carregar os dados do cliente. ' +
          "Verifique se o link está completo e correto.</div>";
        console.error(err);
      });
  }

  if (session) {
    bootTeam();
  } else {
    var initialView = getView();
    if (initialView.type === "client") {
      bootPublic(initialView.slug);
    } else {
      render();
    }
  }
})();
</script>
